<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clappr M3U8 Player Örneği</title>
    
    <!-- Clappr Ana Kütüphanesi -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr@latest/dist/clappr.min.js"></script>
    
    <!-- Kalite Seçici (Level Selector) Eklentisi -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/clappr-level-selector-plugin@latest/dist/clappr-level-selector.min.js"></script>

    <style>
        body {
            background-color: #141414;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .player-container {
            width: 80%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        #player {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <h2>Clappr HLS / M3U8 Oynatıcı</h2>
    
    <div class="player-container">
        <div id="player"></div>
    </div>

    <script>
        var player = new Clappr.Player({
            source: "https://rnttwmjcin.turknet.ercdn.net/lcpmvefbyo/atv/atv_720p.m3u8", // M3u8 adresini buraya yapıştırın
            parentId: "#player",
            plugins: [LevelSelector],
            width: '100%',
            height: '100%',
            autoPlay: false,
            mute: false
        });
    </script>

</body>
</html>
