<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Kesin Sandbox Koruması</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-box {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-box" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı -->
            <iframe 
                id="streamFrame"
                src="https://dlstreams.st/watch/stream-62.php" 
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById("playerContainer");
            const url = "https://dlstreams.st/watch/stream-62.php";

            // Player'ı doğrudan istenen sandbox moduyla sıfırdan yaratan fonksiyon
            function createPlayer(strictMode) {
                // Önce eskisini tamamen yok et
                let oldFrame = document.getElementById("streamFrame");
                if (oldFrame) {
                    oldFrame.remove();
                }

                // Yepyeni iframe üret
                const newFrame = document.createElement("iframe");
                newFrame.id = "streamFrame";
                newFrame.src = url;

                if (strictMode) {
                    // 🛡️ SERT SANDBOX (3 reklamdan sonra): Reklamları ve pop-up'ları tamamen sıfırlar
                    newFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
                } else {
                    // 🔓 ESNEK MOD (İlk 3 reklam için): Tıkanmayı önleyen geçici mod
                    newFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups allow-presentation allow-forms");
                }

                newFrame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                newFrame.setAttribute("allowfullscreen", "true");
                
                container.appendChild(newFrame);
            }

            // 1. Adım: İlk açılışta ilk 3 reklamın takılmadan geçilmesi için esnek mod
            createPlayer(false);

            // 2. Adım: İlk 3 reklamın bitiş süresi (18 saniye) dolduğu an, 
            // eski iframe tamamen sökülür ve yerine SERT SANDBOX'lı yeni iframe dikilir!
            setTimeout(function() {
                console.log("3 reklam atlatıldı, Sert Sandbox zırhı fişeklendi!");
                createPlayer(true);
            }, 18 * 1000); // 18 saniye sonra sert mod

            // 3. Adım: Uzun süreli kullanımlarda şişmeyi önlemek için her 15 dakikada bir 
            // sert modla taze başlangıç
            setInterval(function() {
                createPlayer(true);
            }, 15 * 60 * 1000);

        })();
    </script>
</body>
</html>
