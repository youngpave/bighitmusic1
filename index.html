<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bein Sports 11 - Agresif Mod</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        video { width: 100vw; height: 100vh; border: none; }
    </style>
</head>
<body>

    <video id="video" controls autoplay playsinline></video>

    <script>
        var video = document.getElementById('video');
        var videoSrc = 'https://vix.ijekhaje.xyz/tflix/secure/5e8975608208b7989075ae6d7c460a63d40fcb18273b73c512f36dc2f1ab9903/1791378933/bein1tr.m3u8';

        if (Hls.isSupported()) {
            var hlsConfig = {
                // Tamponu küçük tutuyoruz ki sunucu tıkandığında kilitlenip kalmasın
                maxBufferLength: 10,
                maxMaxBufferLength: 30,
                liveSyncDurationCount: 1,
                // Sunucu takıldığında veya kopmada anında tekrar denemesi için agresif ayarlar
                fragLoadingTimeOut: 10000,
                manifestLoadingTimeOut: 10000,
                startLevel: -1
            };

            var hls = new Hls(hlsConfig);
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(e => {
                    video.muted = true;
                    video.play();
                });
            });
            
            // Hata anında milisaniyesinde yayını tazeleyen mekanizma
            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    console.log("Yayın koptu, anında yeniden yükleniyor...");
                    hls.startLoad();
                }
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
