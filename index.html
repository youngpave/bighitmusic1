<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: absolute;
            top: -60px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 80px);
            border: none;
        }

        /*
         * İlk tıklamayı yakalayan alan.
         * İlk tıklamadan sonra tamamen devre dışı kalır.
         */
        #clickShield {
            position: absolute;
            inset: 0;
            z-index: 9999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="video-container">

    <div id="clickShield"></div>

    <iframe
        id="playerFrame"
        src="https://dlstreams.st/watch/stream-62.php"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>

<script>
    const shield = document.getElementById("clickShield");

    let firstClick = true;

    shield.addEventListener("click", function () {

        if (!firstClick) return;

        firstClick = false;

        // İlk tıklamadan sonra kalkanı tamamen kaldır
        shield.style.display = "none";
        shield.remove();

    }, { once: true });
</script>

</body>
</html>
