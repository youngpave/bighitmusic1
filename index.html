<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <!-- Sadece 1 reklama izin veren son kalkan -->
        <div id="clickShield" onclick="allowOneAd()"></div>

        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        let hasAdPassed = false;

        function allowOneAd() {
            var shield = document.getElementById('clickShield');
            
            if (!hasAdPassed) {
                hasAdPassed = true;
                // İlk tıklamada sistemin ilk reklamı atmasına izin veriyoruz
                shield.style.pointerEvents = 'none';
                
                setTimeout(function() {
                    // Minik bir süre sonra kalkanı tamamen uçuruyoruz
                    shield.style.display = 'none';
                }, 300);
            }
        }

        // Sekme odak kaybı koruması
        window.addEventListener('blur', function() {
            setTimeout(function() {
                window.focus();
            }, 50);
        });
    </script>

</body>
</html>
