<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - beIN Sports 1 TR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            overflow: hidden;
        }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* En baştan aktif olan, reklam ve pop-up'ları tamamen engelleyen şeffaf kalkan */
        #adBlockShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <!-- Reklam Kalkanı -->
        <div id="adBlockShield"></div>

        <iframe 
            id="streamFrame"
            src="" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        // Senin verdiğin yeni ve VPN gerektiren link
        const originalUrl = "https://wideiptv.top/player/BEINSPORTS1TR";
        
        // Türkiye'deki engeli ve VPN zorunluluğunu bypass eden küresel proxy tüneli
        const globalStreamUrl = "https://corsproxy.io/?" + encodeURIComponent(originalUrl);

        window.onload = function() {
            const frame = document.getElementById("streamFrame");
            frame.src = globalStreamUrl;
        };
    </script>

</body>
</html>
