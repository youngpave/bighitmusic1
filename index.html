<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Videonun üzerine gelen şeffaf reklam kalkanı */
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <!-- Reklam tuzaklarını tutacak şeffaf katman -->
        <div id="clickShield" onclick="removeShield()"></div>

        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        // Kullanıcı ilk kez ekrana (reklam tuzaklarının üzerine) tıkladığında 
        // o ilk tıklamayı yutuyoruz ve kalkanı kaldırıyoruz. Böylece player özgür kalıyor.
        function removeShield() {
            var shield = document.getElementById('clickShield');
            if (shield) {
                shield.style.display = 'none'; // Kalkan kalkar, sonraki tıklamalar direkt player'a gider
            }
        }

        // Sekme odak kaybı koruması
        window.addEventListener('blur', function() {
            setTimeout(function() {
                window.focus();
            }, 50);
        });
    </script>

</body>
</html>
