<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;  
            height: 100%; 
            border: none;
        }
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <div id="clickShield"></div>

        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const shield = document.getElementById('clickShield');

        // Yeni sekme açma girişimlerini kökten kesen global engel
        window.open = function() {
            return null;
        };

        // Ortak kalıcı hafıza (localStorage)
        let clickCounter = parseInt(localStorage.getItem('mactv_persistent_counter') || '0');
        const maxAllowed = 2; // Kesin sınır: Maksimum 2 reklam

        if (clickCounter >= maxAllowed) {
            shield.style.display = 'none';
        }

        function handleInteraction(e) {
            clickCounter++;
            localStorage.setItem('mactv_persistent_counter', clickCounter);
            
            if (clickCounter <= maxAllowed) {
                shield.style.pointerEvents = 'none';
                // Bilgisayar ve telefon için sızıntı önleyici bekleme süreleri
                setTimeout(function() {
                    shield.style.pointerEvents = 'auto';
                }, isMobile ? 800 : 1200);
            } else {
                shield.style.display = 'none';
            }
        }

        if (isMobile) {
            shield.addEventListener('touchstart', handleInteraction);
        } else {
            shield.addEventListener('click', handleInteraction);
        }

        // Bilgisayarda arkaya sekme atma trick'lerini anında yakalayıp ana ekrana çeken odak koruması
        window.addEventListener('blur', function() {
            if (clickCounter >= maxAllowed) {
                window.focus();
            }
        });
    </script>

</body>
</html>
