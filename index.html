<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Kırpılmış Özel Görünüm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden; /* Dışarı taşan her şeyi gizler, kırpma etkisini verir */
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* 
          KIRPMA VE ODAKLANMA ALANI:
          İframe'i normal boyutundan daha büyük tutup yukarı kaydırarak 
          üstteki beIN logosunu ve alttaki maç listelerini dışarıda (görünmez) bırakıyoruz.
        */
        .player-wrapper {
            position: absolute;
            top: -280px;  /* Üst kısmı (beIN ve üstü) yukarı kaydırarak kırpar */
            left: 0;
            width: 100%;
            height: calc(100% + 450px); /* Kırpılan payı kurtarmak için yüksekliği artırıyoruz */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-wrapper" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı -->
            <iframe 
                id="streamFrame"
                src="https://dlstreams.st/watch/stream-62.php" 
                sandbox="allow-scripts allow-same-origin allow-popups allow-presentation allow-forms"
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        (function() {
            // Daha önce kurduğumuz 3. saniye sert sandbox zırhı burada da devrede:
            setTimeout(function() {
                const frame = document.getElementById("streamFrame");
                if (frame) {
                    frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
                    console.log("Kırpılmış mod aktif, Sert Sandbox devrede!");
                }
            }, 3 * 1000);
        })();
    </script>
</body>
</html>
