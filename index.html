<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        #clickShield {
            position: absolute;
            inset: 0;
            z-index: 999;
            background: transparent;
        }
    </style>
</head>

<body>

<div class="video-container">

    <div id="clickShield"></div>

    <iframe
        id="playerFrame"
        src="https://dlstreams.st/watch/stream-62.php"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>

<script>

const shield = document.getElementById("clickShield");

const isMobile =
    /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i
    .test(navigator.userAgent);

if (isMobile) {

    const KEY = "mactv_counter";
    const MAX = 2;

    let count = parseInt(localStorage.getItem(KEY) || "0", 10);

    // Daha önce 2 kez kullanıldıysa kalkanı hiç gösterme
    if (count >= MAX) {
        shield.remove();

    } else {

        shield.addEventListener("touchstart", function () {

            count++;

            localStorage.setItem(KEY, count);

            // 2. etkileşimden sonra tamamen kaldır
            if (count >= MAX) {
                shield.remove();
                return;
            }

            // İlk etkileşimden sonra kısa süre bekle
            shield.style.pointerEvents = "none";

            setTimeout(function () {
                if (shield && shield.parentNode) {
                    shield.style.pointerEvents = "auto";
                }
            }, 1200);

        }, { passive: true });
    }

} else {

    // Bilgisayarda kalkan yok
    shield.remove();

}

</script>

</body>
</html>
