<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;  
            height: 100%; 
            border: none;
        }
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <div id="clickShield"></div>

        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const container = document.getElementById('container');
        const shield = document.getElementById('clickShield');
        const oldFrame = document.getElementById('playerFrame');

        if (!isMobile) {
            // 🖥️ BİLGİSAYAR: Stratejik Sandbox Kalkanı (Sorunsuz çalışıyor)
            if (oldFrame) {
                const currentSrc = oldFrame.src;
                oldFrame.remove();

                const secureFrame = document.createElement("iframe");
                secureFrame.id = "playerFrame";
                secureFrame.src = currentSrc;
                secureFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
                secureFrame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                secureFrame.setAttribute("allowfullscreen", "true");
                secureFrame.style.position = "absolute";
                secureFrame.style.top = "0";
                secureFrame.style.left = "0";
                secureFrame.style.width = "100%";
                secureFrame.style.height: "100%";
                secureFrame.style.border = "none";

                container.appendChild(secureFrame);
            }
            shield.remove();

        } else {
            // 📱 TELEFON İÇİN: Çift Kilitli Hafıza Mekanizması (localStorage + Cookie Yedekli)
            // Tarayıcı localStorage'ı temizlese bile sayaç çökmesin diye iki farklı yöntemi aynı anda okuyoruz
            let savedCounter = localStorage.getItem('mactv_persistent_counter');
            
            if (!savedCounter) {
                // Eğer localStorage silindiyse cookielerden kurtarmaya çalış
                const match = document.cookie.match(new RegExp('(^| )mactv_counter=([^;]+)'));
                savedCounter = match ? match[2] : '0';
            }

            let clickCounter = parseInt(savedCounter);
            const maxAllowed = 2; // Maksimum 2 reklam sınırı

            if (clickCounter >= maxAllowed) {
                shield.style.display = 'none';
            }

            function handleInteraction(e) {
                clickCounter++;
                
                // Veriyi hem localStorage'a hem de 1 yıl ömürlü çerezə (cookie) aynı anda yazıyoruz.
                // Bu sayede tarayıcı hafızayı silmeye kalksa bile çerezler sayacı korumaya devam eder.
                localStorage.setItem('mactv_persistent_counter', clickCounter);
                document.cookie = "mactv_counter=" + clickCounter + "; max-age=31536000; path=/";
                
                if (clickCounter <= maxAllowed) {
                    shield.style.pointerEvents = 'none';
                    setTimeout(function() {
                        shield.style.pointerEvents = 'auto';
                    }, 800);
                } else {
                    shield.style.display = 'none';
                }
            }

            shield.addEventListener('touchstart', handleInteraction);
        }
    </script>

</body>
</html>
