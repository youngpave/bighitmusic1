<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Otomatik Tazelenen Koruma</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-box {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-box" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı -->
            <iframe 
                id="streamFrame"
                src="https://dlstreams.st/watch/stream-62.php" 
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById("playerContainer");

            // Player'ı tertemiz sıfırdan kuran ana fonksiyon
            function resetPlayer() {
                let frame = document.getElementById("streamFrame");
                const src = frame ? frame.src : "https://dlstreams.st/watch/stream-62.php";
                
                if (frame) {
                    frame.remove(); // Donan eski iframe'i tamamen uçur
                }

                const secureFrameElem = document.createElement("iframe");
                secureFrameElem.id = "streamFrame";
                secureFrameElem.src = src;
                
                // Güvenli ve tıkınmayan sandbox filtresi
                secureFrameElem.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms allow-popups-to-escape-sandbox");
                
                secureFrameElem.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                secureFrameElem.setAttribute("allowfullscreen", "true");
                
                container.appendChild(secureFrameElem); // Yepyeni, şişmemiş haliyle yerine koy
            }

            // İlk açılışta çalıştır
            resetPlayer();

            // OTO-TAZELEME: Tıkanmalara ve donmalara karşı player'ı her 30 dakikada bir 
            // sanki siteye ilk defa girmişsin gibi tertemiz sıfırdan kurar.
            setInterval(function() {
                resetPlayer();
            }, 30 * 60 * 1000); 
        })();
    </script>
</body>
</html>
