<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Mükemmel Kırpma</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden; /* Dışarı taşan kısımları tamamen gizler */
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* 
          🎯 DÜZELTİLMİŞ KIRPMA ALANI:
          Eğer beIN barı biraz aşağıda kalıyorsa top değerini -90px yapabilirsin.
          Eğer üstten biraz fazla kesiyorsa -130px yapabilirsin.
        */
        .player-wrapper {
            position: absolute;
            top: -115px;  /* Üst kısmı tam beIN barının hemen üzerinden keser */
            left: 0;
            width: 100%;
            height: calc(100% + 230px); /* Kırpılan payı dengeler */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-wrapper" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı -->
            <iframe 
                id="streamFrame"
                src="https://www.taraftarium201.top/" 
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

</body>
</html>
