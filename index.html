<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bein Sports 1 - Süper Agresif Mod</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        video { width: 100vw; height: 100vh; border: none; }
    </style>
</head>
<body>

    <video id="video" controls autoplay playsinline></video>

    <script>
        var video = document.getElementById('video');
        var videoSrc = 'https://vix.ijekhaje.xyz/tflix/secure/f9aba2a0c046b78cedda92145f222969bb3fe9b81724124fb6cb1c0dcb86fe86/1791388261/bein1tr.m3u8';

        if (Hls.isSupported()) {
            var hlsConfig = {
                liveSyncDuration: 50,
                liveMaxLatencyDuration: 80,
                maxBufferLength: 120,
                maxMaxBufferLength: 240,
                
                // Sunucu yavaşsa veya cevap vermiyorsa hemen tetiklenecek süreler
                fragLoadingTimeOut: 15000,
                manifestLoadingTimeOut: 15000,
                levelLoadingTimeOut: 15000,
                
                // Takılmaları en aza indirmek için otomatik kurtarma eşikleri
                lowLatencyMode: false
            };

            var hls = new Hls(hlsConfig);
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(e => {
                    video.muted = true;
                    video.play();
                });
            });
            
            // Oynatıcı takıldığında (buffer bittiğinde) anında tetiklenecek akıllı kurtarıcı
            video.addEventListener('waiting', function() {
                console.log("Yayın akışı takıldı, kurtarma tetikleniyor...");
                hls.startLoad();
            });

            // Hata anında milisaniyesinde yeniden bağlanma
            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.log("Ağ hatası, yükleme yeniden başlatılıyor...");
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.log("Medya hatası kurtarılıyor...");
                            hls.recoverMediaError();
                            break;
                        default:
                            console.log("Kritik hata, akış tazeleniyor...");
                            hls.loadSource(videoSrc);
                            break;
                    }
                }
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
