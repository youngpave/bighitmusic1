
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LİVE STREAM B</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#000; overflow:hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #fff; }

    .container { display: flex; width: 100vw; height: 100vh; }
    
    .channels-section { width: 20%; height: 100%; background: #121212; padding: 10px; display: flex; flex-direction: column; border-right: 1px solid #222; overflow-y: auto; flex-shrink: 0; }
    
    .section-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; padding-left: 2px; }

    .channel-grid { display: flex; flex-direction: column; gap: 8px; }
    
    .channel-btn { 
        background: #1e1e1e; border: 1px solid #333; border-radius: 6px; padding: 8px;
        display: flex; align-items: center; gap: 8px; cursor: pointer; width: 100%; text-align: left;
        transition: all 0.2s ease;
    }
    .channel-btn:hover { background: #2a2a2a; border-color: #444; }
    .channel-btn:active { background: #333; }

    .channel-logo { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
    .channel-info { display: flex; flex-direction: column; }
    .channel-name { font-size: 13px; font-weight: 600; line-height: 1.2; color: #fff; }
    .channel-meta { font-size: 9px; color: #888; margin-top: 1px; }

    .logo-bein { filter: brightness(0) invert(1); }

    .player-wrapper { width: 80%; height: 100%; background: #000; position: relative; }
    iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>

<div class="container">
    <div class="channels-section">
        <div class="section-title">Kanallar</div>
        <div class="channel-grid">
            <button class="channel-btn" onclick="changeChannel('https://hamilive.vivtops.st/channel35')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/BeIN_Sports_1_%282020%29.svg" alt="B1" class="channel-logo logo-bein">
                <div class="channel-info">
                    <span class="channel-name">B1</span>
                    <span class="channel-meta">Canlı</span>
                </div>
            </button>
            <button class="channel-btn" onclick="changeChannel('https://universaltokenforall.st/player2/channel35')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/BeIN_Sports_1_%282020%29.svg" alt="B2" class="channel-logo logo-bein">
                <div class="channel-info">
                    <span class="channel-name">B2</span>
                    <span class="channel-meta">Canlı</span>
                </div>
            </button>
        </div>
    </div>

    <div class="player-wrapper" id="playerContainer">
        <iframe id="videoPlayer" 
            src="https://0edb5c66.ppppdata.com/p/8128308/t/aa2240528473c1d2649e594bc89f4470/?c=2" 
            width="100%" 
            height="100%" 
            style="border:0;" 
            allowfullscreen 
            allow="autoplay; encrypted-media">
        </iframe>
    </div>
</div>

<script>
function changeChannel(url) {
    document.getElementById('videoPlayer').src = url;
}
</script>
</body>
</html>
