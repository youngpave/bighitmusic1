<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Temiz Kırpılmış Görünüm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden; /* Taşmaları ve istenmeyen dış alanları gizler */
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* 
          Kırpma Alanı: Üstteki gereksiz site başlığını keser, 
          beIN kumanda barını ve video alanını tam istediğin oranda gösterir.
        */
        .player-wrapper {
            position: absolute;
            top: -110px;  
            left: 0;
            width: 100%;
            height: calc(100% + 220px); 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-wrapper" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı -->
            <iframe 
                id="streamFrame"
                src="https://www.taraftarium201.top/" 
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

</body>
</html>
