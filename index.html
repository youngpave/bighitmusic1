<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Koruma Modu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-box {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

<div class="app-container">
    <div class="player-box" id="playerContainer">

        <iframe
            id="streamFrame"
            src="https://dlstreams.st/watch/stream-62.php"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>
</div>

<script>
(function () {

    const container = document.getElementById("playerContainer");
    const oldFrame = document.getElementById("streamFrame");

    if (!oldFrame) return;

    const src = oldFrame.src;
    oldFrame.remove();

    const frame = document.createElement("iframe");

    frame.id = "streamFrame";
    frame.src = src;

    /*
     * Sandbox:
     *
     * allow-scripts
     *      Yayının JavaScript'inin çalışmasına izin verir.
     *
     * allow-same-origin
     *      Yayının kendi origin davranışını korur.
     *
     * allow-forms
     *      Gerekli formların çalışmasına izin verir.
     *
     * allow-presentation
     *      Tam ekran / sunum özelliklerini korur.
     *
     * allow-popups
     *      Bilerek VERİLMİYOR.
     *      Böylece iframe'in window.open() ile
     *      yeni pencere açması engellenir.
     */

    frame.setAttribute(
        "sandbox",
        "allow-scripts allow-same-origin allow-forms allow-presentation"
    );

    frame.setAttribute(
        "allow",
        "autoplay; fullscreen; encrypted-media; picture-in-picture"
    );

    frame.setAttribute("allowfullscreen", "true");

    container.appendChild(frame);

})();
</script>

</body>
</html>
