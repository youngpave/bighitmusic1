<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - beIN Barı Dahil Kırpılmış Görünüm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden; /* Taşan kısımları gizler */
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* 
          🎯 BEYİN / KANAL BARINDAN BAŞLAYAN KIRPMA:
          top değerini küçülttük ki üstteki menü gitsin ama beIN 1 barı ve reklamlar tam tepede görünsün.
        */
        .player-wrapper {
            position: absolute;
            top: -110px;  /* Sadece en üstteki site logosunu ve menüyü keser, beIN barını korur */
            left: 0;
            width: 100%;
            height: calc(100% + 220px); 
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-wrapper" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı -->
            <iframe 
                id="streamFrame"
                src="https://www.taraftarium201.top/" 
                sandbox="allow-scripts allow-same-origin allow-popups allow-presentation allow-forms"
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        (function() {
            // Tam 3 saniye sonra akışı bozmadan sert sandbox zırhını devreye sokan güvenli yapı
            setTimeout(function() {
                const frame = document.getElementById("streamFrame");
                if (frame) {
                    frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
                    console.log("beIN barı korumalı kırpma aktif, Sert Sandbox devrede!");
                }
            }, 3 * 1000); // 3 saniye
        })();
    </script>
</body>
</html>
