<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Maç TV Pro</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; background:#000; overflow:hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #fff; }

    .container { display: flex; width: 100vw; height: 100vh; }
    
    /* Sol Kanal Listesi Alanı - Ekranın %20'si */
    .channels-section { width: 20%; height: 100%; background: #121212; padding: 10px; display: flex; flex-direction: column; border-right: 1px solid #222; overflow-y: auto; flex-shrink: 0; }
    
    .section-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #aaa; padding-left: 2px; }

    /* Kanal Butonları Dikey Dizin */
    .channel-grid { display: flex; flex-direction: column; gap: 8px; }
    
    .channel-btn { 
        background: #1e1e1e; border: 1px solid #333; border-radius: 6px; padding: 8px;
        display: flex; align-items: center; gap: 8px; cursor: pointer; width: 100%; text-align: left;
        transition: all 0.2s ease;
    }
    .channel-btn:hover { background: #2a2a2a; border-color: #444; }
    .channel-btn:active { background: #333; }

    /* Kanal Logosu */
    .channel-logo { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }

    /* Kanal Yazısı */
    .channel-info { display: flex; flex-direction: column; }
    .channel-name { font-size: 13px; font-weight: 600; line-height: 1.2; color: #fff; }
    .channel-meta { font-size: 9px; color: #888; margin-top: 1px; }

    /* beIN SPORTS Logoları İçin Renkler */
    .logo-bein { filter: brightness(0) invert(1); }

    /* Sağ Video Oynatıcı Alanı - Ekranın %80'i */
    .player-wrapper { width: 80%; height: 100%; background: #000; position: relative; }
    
    /* Tam Ekran Modu Sınıfı */
    .player-wrapper.fullscreen-mode {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 999999;
    }

    /* Özel Tam Ekran Butonu */
    .fs-btn {
        position: absolute;
        bottom: 15px;
        right: 15px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        z-index: 1000000;
        transition: background 0.2s;
    }
    .fs-btn:hover { background: rgba(255, 255, 255, 0.2); }

    iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>

<div class="container">
    <!-- Sol Kanal Listesi (%20) -->
    <div class="channels-section">
        <div class="section-title">Kanallar</div>
        
        <div class="channel-grid">
            <!-- B1 -->
            <button class="channel-btn" onclick="changeChannel('https://hesgoaler.com/stream.php?ch=beINSPORTS1TR')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/BeIN_Sports_1_%282020%29.svg" alt="B1" class="channel-logo logo-bein">
                <div class="channel-info">
                    <span class="channel-name">B1</span>
                    <span class="channel-meta">Canlı</span>
                </div>
            </button>

            <!-- B2 -->
            <button class="channel-btn" onclick="changeChannel('https://victorystreams.shop/streams/stream-63.php')">
                 <img src="https://upload.wikimedia.org/wikipedia/commons/4/42/BeIN_Sports_2_%282020%29.svg" alt="B2" class="channel-logo logo-bein">
                <div class="channel-info">
                    <span class="channel-name">B2</span>
                    <span class="channel-meta">Canlı</span>
                </div>
            </button>

            <!-- B3 -->
            <button class="channel-btn" onclick="changeChannel('https://dlhd.st/cast/stream-64.php')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e0/BeIN_Sports_3_%282020%29.svg" alt="B3" class="channel-logo logo-bein">
                <div class="channel-info">
                    <span class="channel-name">B3</span>
                    <span class="channel-meta">Canlı</span>
                </div>
            </button>
            
            <!-- B4 -->
            <button class="channel-btn" onclick="changeChannel('https://victorystreams.shop/streams/stream-67.php')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/cd/BeIN_Sports_4_%282020%29.svg" alt="B4" class="channel-logo logo-bein">
                <div class="channel-info">
                    <span class="channel-name">B4</span>
                    <span class="channel-meta">Canlı</span>
                </div>
            </button>

            <!-- B5 -->
            <button class="channel-btn" onclick="changeChannel('https://victorystreams.shop/streams/stream-66.php')">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/38/BeIN_Sports_Haber_%282020%29.svg" alt="B5" class="channel-logo logo-bein">
                <div class="channel-info">
                    <span class="channel-name">B5</span>
                    <span class="channel-meta">Haber</span>
                </div>
            </button>
        </div>
    </div>

    <!-- Sağ Video Oynatıcı (%80) -->
    <div class="player-wrapper" id="playerContainer">
        <button class="fs-btn" onclick="toggleFullscreen()">Tam Ekran</button>
        <iframe id="videoPlayer" 
            src="https://dlhd.st/cast/stream-64.php" 
            width="100%" 
            height="100%" 
            style="border:0;" 
            allowfullscreen="true" 
            webkitallowfullscreen="true" 
            mozallowfullscreen="true"
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture">
        </iframe>
    </div>
</div>

<script>
    function changeChannel(url) {
        const playerContainer = document.getElementById('playerContainer');
        const isFs = playerContainer.classList.contains('fullscreen-mode');
        
        playerContainer.innerHTML = `
            <button class="fs-btn" onclick="toggleFullscreen()">${isFs ? 'Küçült' : 'Tam Ekran'}</button>
            <iframe id="videoPlayer" 
                src="${url}" 
                width="100%" 
                height="100%" 
                style="border:0;" 
                allowfullscreen="true" 
                webkitallowfullscreen="true" 
                mozallowfullscreen="true"
                allow="autoplay; encrypted-media; fullscreen; picture-in-picture">
            </iframe>
        `;
        if (isFs) {
            playerContainer.classList.add('fullscreen-mode');
        }
    }

    function toggleFullscreen() {
        const container = document.getElementById('playerContainer');
        const btn = container.querySelector('.fs-btn');
        container.classList.toggle('fullscreen-mode');
        
        if (container.classList.contains('fullscreen-mode')) {
            btn.innerText = 'Küçült';
        } else {
            btn.innerText = 'Tam Ekran';
        }
    }
</script>

</body>
</html>
