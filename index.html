<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Tam Ekran Oynatıcı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* Sayfanın tamamını kaplaması ve kaydırma çubuklarının çıkmaması için body ayarı */
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            overflow: hidden;
        }

        /* Oynatıcının ekranı tam olarak doldurması için esnek yapı */
        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- Tam Ekran Canlı Yayın Oynatıcısı -->
    <div class="video-wrapper">
        <iframe 
            id="streamFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            sandbox="allow-scripts allow-same-origin allow-popups allow-presentation allow-forms"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        // Sayfa açıldıktan tam 5 saniye sonra akışı bozmadan sert sandbox zırhını devreye sokar
        window.onload = function() {
            setTimeout(function() {
                const frame = document.getElementById("streamFrame");
                if (frame) {
                    frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
                    console.log("5 saniye doldu, Tam Ekran Kesintisiz Sert Sandbox aktif!");
                }
            }, 5 * 1000); // 5 saniye
        };
    </script>

</body>
</html>
