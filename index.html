<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Yayın</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; font-family: sans-serif; }
        video { width: 100%; height: 100%; object-fit: contain; }
        #panel {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(15, 15, 15, 0.95); padding: 15px; border-radius: 8px; border: 1px solid #333;
        }
        button { background: #e50914; color: #fff; border: none; padding: 10px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
        #status { margin-top: 8px; font-size: 13px; color: #ffcc00; }
    </style>
</head>
<body>

    <div id="panel">
        <div id="status">Yükleniyor...</div>
        <button id="btn" style="display:none;">Yayını Başlat</button>
    </div>

    <video id="v" autoplay playsinline controls></video>

    <script>
        const ROOM_ID = "vavoo-yayin-oda-2026-x";
        const isAdmin = new URLSearchParams(window.location.search).get('admin') === '1';
        const video = document.getElementById('v');
        const status = document.getElementById('status');
        const btn = document.getElementById('btn');

        // TURN hatasını tamamen kesmek için saf PeerJS bağlantısı
        let peer = new Peer(isAdmin ? ROOM_ID : undefined);

        if (isAdmin) {
            let localStream = null;
            peer.on('open', () => {
                status.innerText = "Admin hazır. Butona basıp sekme seç.";
                btn.style.display = 'block';
            });
            peer.on('error', (e) => {
                status.innerText = "Hata: " + e.type;
            });
            peer.on('call', (call) => {
                if (localStream) call.answer(localStream);
                else call.answer();
            });
            btn.onclick = async () => {
                try {
                    localStream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 30 }, audio: true });
                    video.srcObject = localStream;
                    status.innerText = "YAYINDA!";
                    btn.innerText = "Durdur";
                } catch(err) {
                    status.innerText = "İptal edildi.";
                }
            };
        } else {
            peer.on('open', () => {
                status.innerText = "Yayına bağlanılıyor...";
                
                // Bağlantı isteği
                const call = peer.call(ROOM_ID, new MediaStream());
                
                call.on('stream', (stream) => {
                    status.innerText = "Bağlantı başarılı!";
                    video.srcObject = stream;
                    video.play().catch(()=>{});
                });
                
                call.on('error', () => {
                    status.innerText = "Bağlantı kurulamadı.";
                });
            });
        }
    </script>
</body>
</html>
