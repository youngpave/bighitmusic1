<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Akıllı Sandbox Koruması</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-box {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-box" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı -->
            <iframe 
                id="streamFrame"
                src="https://dlstreams.st/watch/stream-62.php" 
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById("playerContainer");
            const url = "https://dlstreams.st/watch/stream-62.php";

            // Player'ı kuran ana fonksiyon (withSandbox parametresine göre sertleşir veya yumuşar)
            function buildPlayer(withSandbox) {
                let frame = document.getElementById("streamFrame");
                if (frame) {
                    frame.remove();
                }

                const newFrame = document.createElement("iframe");
                newFrame.id = "streamFrame";
                newFrame.src = url;

                // EĞER SANDBOX AKTİFSE (Reklamlar geçildikten sonra): En sert zırhı vur
                if (withSandbox) {
                    newFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
                } 
                // İLK AÇILIŞTA (İlk reklamlar oynarken): Tıkanmaması için pop-up esnekliği
                else {
                    newFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups allow-presentation allow-forms");
                }

                newFrame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                newFrame.setAttribute("allowfullscreen", "true");
                
                container.appendChild(newFrame);
            }

            // 1. Adım: İlk açılış (İlk reklamların takılmadan geçilmesi için esnek modda başlar)
            buildPlayer(false);

            // 2. Adım: İlk reklamlar (ilk 3 reklam) döküldükten kısa bir süre sonra (örn: 20 saniye sonra) 
            // SERT SANDBOX devreye girer ve bir daha dışarıdan/içeriden reklam sızmasına izin vermez!
            setTimeout(function() {
                console.log("Reklamlar geçildi, Sert Sandbox Zırhı devreye sokuluyor...");
                buildPlayer(true);
            }, 20 * 1000); // 20 saniye sonra sert mod aktifleşir

            // 3. Adım: Uzun süreli kullanımlarda şişmeyi önlemek için her 15 dakikada bir 
            // sert sandbox moduyla sıfırdan taze kuruş
            setInterval(function() {
                buildPlayer(true);
            }, 15 * 60 * 1000);

        })();
    </script>
</body>
</html>
