<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Kesintisiz Kalkanlı Oynatıcı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            overflow: hidden;
        }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 
          🛡️ REKLAM KALKANI (OVERLAY):
          İlk 5 saniye devre dışıdır (gizlidir). 
          5 saniye dolduğun an oynatıcının üzerine inerek arkadan pop-up açılmasını tetikleyecek 
          tüm dış tıklama ve yönlendirmeleri tamamen engeller.
        */
        #adShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            display: none; /* İlk 5 saniye kapalı, yayın rahatça açılır */
        }
    </style>
</head>
<body>

    <div class="video-wrapper" id="playerContainer">
        <!-- Reklamları engelleyen şeffaf kalkan -->
        <div id="adShield"></div>

        <iframe 
            id="streamFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        // Sayfa açıldıktan tam 5 saniye sonra, akışı hiç bozmadan, 
        // ekranı yenilemeden reklam kalkanını sessizce aktif ediyoruz.
        window.onload = function() {
            setTimeout(function() {
                const shield = document.getElementById("adShield");
                if (shield) {
                    shield.style.display = "block"; // Kalkan örtülür
                    console.log("5 saniye doldu: Reklam kalkanı devrede, yenilenme yok!");
                }
            }, 5 * 1000); // 5 Saniye
        };
    </script>

</body>
</html>
