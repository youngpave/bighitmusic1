<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaçTV - Kesintisiz Oynatıcı</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .player-box {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>

<div class="app-container">
    <div class="player-box" id="playerContainer">

        <iframe
            id="streamFrame"
            src="https://wideiptv.top/player/BEINSPORTS1TR"
            sandbox="allow-scripts allow-same-origin allow-presentation allow-forms allow-modals allow-pointer-lock"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>
</div>

<script>
(function () {

    const frame = document.getElementById("streamFrame");

    if (!frame) return;

    /*
     * Player KORUNUYOR.
     *
     * iframe yenilenmiyor.
     * Böylece canlı yayın her birkaç dakikada
     * bir yeniden başlatılmıyor.
     *
     * allow-popups kullanılmıyor.
     * Bu nedenle popup/reklam açma yetkisi
     * özellikle verilmemiş oluyor.
     */


    /*
     * Sayfa görünürlük kontrolü
     *
     * Kullanıcı başka uygulamaya geçip geri döndüğünde
     * iframe'e odaklanmayı deniyoruz.
     *
     * iframe'in içeriğine müdahale etmiyoruz.
     */

    document.addEventListener("visibilitychange", function () {

        if (!document.hidden) {

            try {
                frame.focus();
            } catch (e) {
                // iframe odaklanmayı desteklemiyorsa hiçbir şey yapma
            }

        }

    });


    /*
     * Kullanıcı player alanına dokunduğunda iframe'in
     * odaklanmasını sağla.
     */

    frame.addEventListener("load", function () {

        try {
            frame.focus();
        } catch (e) {}

    });

})();
</script>

</body>
</html>
