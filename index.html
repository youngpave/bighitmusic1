<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tam Ekran Yayın</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        .container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        /* Şeffaf Engelleyici Katman */
        #engelci {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Şeffaf Katman -->
        <div id="engelci" onclick="reklamiGec(this)"></div>

        <!-- Yayın İframe'i -->
        <iframe src="https://dlive.sx/stream/stream-62.php" 
                sandbox="allow-scripts allow-same-origin allow-presentation allow-forms allow-popups allow-popups-to-escape-sandbox" 
                allowfullscreen 
                frameborder="0"></iframe>
    </div>

    <script>
        function reklamiGec(element) {
            // İlk tıklamada aradan çekilir, böylece reklam açılır.
            // Sonrasında bir daha tıklamaları yakalamaz, yayın oynatıcısına geçiş yapılır.
            element.style.display = 'none';
        }
    </script>

</body>
</html>
