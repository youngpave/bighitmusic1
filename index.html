<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Kesin Kilitli Oynatıcı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            overflow: hidden;
        }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <!-- Tam Ekran Canlı Yayın Oynatıcısı -->
    <div class="video-wrapper" id="playerContainer">
        <iframe 
            id="streamFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            sandbox="allow-scripts allow-same-origin allow-popups allow-presentation allow-forms"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        window.onload = function() {
            // Tam 5 saniye sonra çalışır
            setTimeout(function() {
                const container = document.getElementById("playerContainer");
                const oldFrame = document.getElementById("streamFrame");
                
                if (container && oldFrame) {
                    const currentSrc = oldFrame.src;
                    
                    // Eski iframe'i tamamen yok et
                    oldFrame.remove();

                    // YERİNE KİLİTLİ YENİ IFRAME DİK (allow-popups kelimesi KESİNLİKLE YOK)
                    const lockedFrame = document.createElement("iframe");
                    lockedFrame.id = "streamFrame";
                    lockedFrame.src = currentSrc;
                    
                    // 🛡️ SERT SANDBOX: Pop-up yetkisi kökten kazındığı için neye tıklarsan tıkla reklam açılmaz!
                    lockedFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
                    
                    lockedFrame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                    lockedFrame.setAttribute("allowfullscreen", "true");

                    container.appendChild(lockedFrame);
                    console.log("5 saniye doldu: Sert Sandbox zırhı giydirildi, reklamlar tamamen kilitlendi!");
                }
            }, 5 * 1000); // 5 Saniye
        };
    </script>

</body>
</html>
