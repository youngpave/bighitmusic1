<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: absolute;
            top: -60px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 80px);
            border: none;
        }

        /* Zırhlı Kalkan: İlk tıklamalarda reklamın ilk dalgasını alıp sonra tamamen kalkar */
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="video-container">

    <div id="clickShield"></div>

    <iframe
        id="playerFrame"
        src="https://dlstreams.st/stream/stream-62.php"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>

<script>
    let clickCount = 0;
    const maxAllowed = 2; // İlk 2 tıklama (oynatıcıyı uyandırmak için gereken zorunlu pay)
    const shield = document.getElementById("clickShield");

    // Net Çözüm: Sayfanın kendi içinde yeni sekme açma komutlarını tamamen kilitliyoruz
    // Bu sayede video player çalışmaya devam eder ama dışarıya sekme fırlatılamaz.
    window.open = function() {
        console.log("Engellenen reklam girişimi.");
        return null;
    };

    function handleInteraction(e) {
        clickCount++;

        if (clickCount <= maxAllowed) {
            // İlk tıklamalarda kalkanı anlık açıp kapatıyoruz
            shield.style.pointerEvents = 'none';
            setTimeout(function() {
                shield.style.pointerEvents = 'auto';
            }, 300);
        } else {
            // Sınır dolunca kalkan tamamen çöpe gider, video tamamen serbest kalır
            shield.remove();
        }
    }

    shield.addEventListener("mousedown", handleInteraction);
    shield.addEventListener("touchstart", handleInteraction);

    // Odak kaybı (pop-under) saldırılarını anında geri toparlayan kilit
    window.addEventListener('blur', function() {
        if (clickCount > maxAllowed) {
            window.focus();
        }
    });
</script>

</body>
</html>
