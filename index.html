<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Taraftarium Kırpılmış Görünüm</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden; /* Dışarı taşan (kırpılan) kısımları tamamen gizler */
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /* 
          🎯 KIRPMA VE OTurtma ALANI:
          Siteyi yukarı kaydırarak üstteki beIN logosunu, menüleri ve reklamları gizliyoruz.
        */
        .player-wrapper {
            position: absolute;
            top: -240px;  /* Üst kısmı yukarı kaydırarak keser (gerekirse -220px veya -260px yapabilirsin) */
            left: 0;
            width: 100%;
            height: calc(100% + 380px); /* Kırpılan payı alttan ve üstten dengeler */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-wrapper" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı (Başlangıçta esnek modda, ilk reklamlar takılmasın diye) -->
            <iframe 
                id="streamFrame"
                src="https://www.taraftarium201.top/" 
                sandbox="allow-scripts allow-same-origin allow-popups allow-presentation allow-forms"
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        (function() {
            // Tam 3 saniye sonra oynatıcıya ve akışa hiç dokunmadan, sayfayı yenilemeden 
            // arka planda sert sandbox zırhını devreye sokarak reklamları sıfırlıyoruz.
            setTimeout(function() {
                const frame = document.getElementById("streamFrame");
                if (frame) {
                    frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
                    console.log("Taraftarium kırpıldı ve Sert Sandbox devrede!");
                }
            }, 3 * 1000); // 3 saniye
        })();
    </script>
</body>
</html>
