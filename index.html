<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: absolute;
            top: -60px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 80px);
            border: none;
        }

        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="video-container" id="container">

    <div id="clickShield"></div>

    <iframe
        id="playerFrame"
        src="https://dlstreams.st/stream/stream-62.php"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>

<script>
    const shield = document.getElementById("clickShield");
    const container = document.getElementById("container");

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    window.open = function() {
        return null;
    };

    if (!isMobile) {
        // 🖥️ BİLGİSAYAR: Sıfır reklam, direkt sandbox
        const oldFrame = document.getElementById("playerFrame");
        if (oldFrame) {
            const currentSrc = oldFrame.src;
            oldFrame.remove();

            const secureFrame = document.createElement("iframe");
            secureFrame.id = "playerFrame";
            secureFrame.src = currentSrc;
            secureFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation");
            secureFrame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
            secureFrame.setAttribute("allowfullscreen", "true");
            
            secureFrame.style.position = "absolute";
            secureFrame.style.top = "-60px";
            secureFrame.style.left = "-10px";
            secureFrame.style.width = "calc(100% + 20px)";
            secureFrame.style.height = "calc(100% + 80px)";
            secureFrame.style.border = "none";

            container.appendChild(secureFrame);
        }
        shield.remove();
    } else {
        // 📱 TELEFON: Kalıcı hafıza + sızıntı önleyici zamanlı kalkan ayarı
        let hasClicked = localStorage.getItem('mactv_clicked_once');

        if (hasClicked === 'true') {
            shield.remove(); // Daha önce tıklandıysa kalkan hiç çıkmaz, günler sonra bile tertemiz açılır
        } else {
            shield.addEventListener("touchstart", function(e) {
                localStorage.setItem('mactv_clicked_once', 'true');
                
                // İlk dokunuş anında kalkanı hemen yok etmiyoruz; 
                // sitenin arka arkaya patlatmaya çalıştığı kaçak reklamları engellemek için 
                // kalkanı 1.2 saniye boyunca devrede (blokeli) tutuyoruz.
                shield.style.pointerEvents = 'none';
                setTimeout(function() {
                    shield.remove();
                }, 1200);
            });
        }
    }
</script>

</body>
</html>
