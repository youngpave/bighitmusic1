<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - 2 Reklam Sonrası Kilit</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            overflow: hidden;
        }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 2 reklamdan sonra devreye girip yeni sekmeleri mühürleyen şeffaf kalkan */
        #adBlockShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            display: none; /* İlk başta açık (reklamların çıkmasına izin verilir) */
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <!-- Kalkan -->
        <div id="adBlockShield"></div>

        <iframe 
            id="streamFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        window.onload = function() {
            // İlk 2 reklamın rahatça çıkabilmesi için süre tanınıyor (Örn: 6 saniye). 
            // Bu süre içinde ekrana tıklayıp ilk 2 reklamı geçebilirsin.
            setTimeout(function() {
                const shield = document.getElementById("adBlockShield");
                if (shield) {
                    shield.style.display = "block"; // Süre bitince kalkan örtülür
                    console.log("2 reklam hakkı doldu: Kalkan aktif, bir daha reklam çıkmayacak!");
                }
            }, 6 * 1000); // 6 Saniye (2 reklam payı)
        };
    </script>

</body>
</html>
