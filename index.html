<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <!-- 2 reklam sınırını koruyan katman -->
        <div id="clickShield" onclick="allowTwoAds()"></div>

        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        let clickCount = 0;
        const allowedAds = 2; // İzin verilen maksimum reklam tıklama sayısı

        function allowTwoAds() {
            clickCount++;
            var shield = document.getElementById('clickShield');
            
            if (clickCount <= allowedAds) {
                // İlk 2 tıklamada kalkanı anlık olarak çekip geri koyuyoruz 
                // ki kaynak sitenin kendi reklam tetikleyicileri (ilk 2 adet) çalışabilsin.
                shield.style.pointerEvents = 'none';
                
                setTimeout(function() {
                    // 300 milisaniye sonra kalkan tekrar aktifleşiyor 
                    // (2. reklam da aradan çıktıktan sonra sonrakileri bloke etmek için)
                    shield.style.pointerEvents = 'auto';
                }, 300);

                console.log("İzin verilen reklam tıklaması: " + clickCount);
            } else {
                // 2 reklam dolduktan sonra kalkanı tamamen ortadan kaldırıyoruz
                shield.style.display = 'none';
                console.log("Reklam hakkı doldu, kalkan tamamen kaldırıldı.");
            }
        }

        // Sekme odak kaybı koruması
        window.addEventListener('blur', function() {
            setTimeout(function() {
                window.focus();
            }, 50);
        });
    </script>

</body>
</html>
