<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MaçTV - Sandbox Canlı Yayın</title>
    <style>
      body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      .sandbox { width: 100%; height: 100%; position: relative; }
      .sandbox iframe { width: 100%; height: 100%; border: none; }
      /* Telefonda reklamları süzmek için şeffaf kalkan */
      #clickShield {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; background: transparent;
      }
    </style>
  </head>
  <body>

    <main role="main" style="width: 100%; height: 100%;">
      <div class="sandbox">
        <!-- Kod şablonunun içine bilgisayar için sandbox zırhını ekledik -->
        <pre><code class="html">&lt;iframe src="https://dlstreams.st/watch/stream-62.php" sandbox="allow-scripts allow-same-origin allow-presentation allow-forms" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen&gt;&lt;/iframe&gt;</code></pre>
        
        <!-- Telefonda hafızayı unutmayan kalkan katmanı -->
        <div id="clickShield"></div>

        <iframe id="playerFrame"></iframe>
      </div>
    </main>

    <script type="module">
      import sandbox from "./sandbox.js";
      sandbox();

      // Mobil cihazlar için URL Mühürlü Hafıza ve Kalkan Sistemi
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const shield = document.getElementById("clickShield");

      if (isMobile) {
          const KEY = "mactv_counter";
          const MAX = 2;

          function getCount() {
              try {
                  if (window.location.hash.includes("mactv_done=true")) return MAX;
                  const localVal = localStorage.getItem(KEY);
                  const nameVal = window.name;
                  if (localVal >= MAX || nameVal >= MAX) return MAX;
                  return parseInt(localVal || nameVal || "0", 10);
              } catch (e) { return 0; }
          }

          let count = getCount();

          if (count >= MAX) {
              shield.remove();
          } else {
              shield.addEventListener("touchstart", function () {
                  count++;
                  try {
                      localStorage.setItem(KEY, count);
                      window.name = count.toString();
                      if (count >= MAX) {
                          history.replaceState(null, "", "#mactv_done=true");
                      }
                  } catch (e) {}

                  if (count >= MAX) {
                      shield.remove();
                      return;
                  }

                  shield.style.pointerEvents = "none";
                  setTimeout(function () {
                      if (shield && shield.parentNode) {
                          shield.style.pointerEvents = "auto";
                      }
                  }, 1200);
              }, { passive: true });
          }

          window.open = function() { return null; };
          window.addEventListener('blur', function() {
              if (getCount() >= MAX) { window.focus(); }
          });
      } else {
          // Bilgisayarda kalkan gerekmez, doğrudan kaldırıyoruz
          shield.remove();
      }
    </script>
  </body>
</html>
