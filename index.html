<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;  
            height: 100%; 
            border: none;
        }
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <div id="clickShield"></div>

        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        // localStorage kullanarak kalıcı sayaç (Günler sonra bile hafızasını kaybetmez)
        let clickCounter = parseInt(localStorage.getItem('mactv_persistent_counter') || '0');
        const maxAllowed = 2; // Kesin sınır: Maksimum 2 reklam
        const shield = document.getElementById('clickShield');

        // Eğer daha önce sınır dolduysa, sayfa açıldığı an kalkanı direkt ortadan kaldır
        if (clickCounter >= maxAllowed) {
            shield.style.display = 'none';
        }

        function handleInteraction(e) {
            clickCounter++;
            localStorage.setItem('mactv_persistent_counter', clickCounter);
            
            if (clickCounter <= maxAllowed) {
                // İlk tıklamalarda kalkanı kısa süreliğine pasife alıp geçişe izin veriyoruz
                shield.style.pointerEvents = 'none';
                setTimeout(function() {
                    shield.style.pointerEvents = 'auto';
                }, 300);
            } else {
                // Sınır dolduğunda kalkan tamamen kalkar
                shield.style.display = 'none';
            }
        }

        // Sadece mousedown (ve mobil için touchstart) kullanarak çift tetiklenmeyi önlüyoruz
        shield.addEventListener('mousedown', handleInteraction);
        shield.addEventListener('touchstart', handleInteraction);

        window.addEventListener('blur', function() {
            if (clickCounter > maxAllowed) {
                window.focus();
            }
        });
    </script>

</body>
</html>
