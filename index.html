<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        /* İsteğe bağlı kırpma/orijinal ayar (Burada orijinal temiz boyutta) */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;  
            height: 100%; 
            border: none;
        }
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <div id="clickShield"></div>

        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        let clickCount = 0;
        const shield = document.getElementById("clickShield");

        // Cihazın bilgisayar olup olmadığını net olarak ayırt ediyoruz
        const isDesktop = !(/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent));

        function handleInteraction(e) {
            clickCount++;

            if (isDesktop) {
                // --- BİLGİSAYAR İÇİN ÖZEL KONTROL ---
                // Bilgisayarda tıklama sayısını ve kalkan disiplinini sıkı tutuyoruz
                if (clickCount <= 2) {
                    shield.style.pointerEvents = 'none';
                    setTimeout(function() {
                        shield.style.pointerEvents = 'auto';
                    }, 400);
                } else {
                    shield.remove();
                }
            } else {
                // --- TELEFON / MOBİL İÇİN SAF AKIŞ ---
                // Mobilde ekstra karmaşaya girmeden ilk tıklamada kalkanı uçuruyoruz
                if (clickCount === 1) {
                    shield.style.pointerEvents = 'none';
                    setTimeout(function() {
                        shield.style.display = 'none';
                    }, 300);
                }
            }
        }

        // Bilgisayar için mousedown, telefon için touchstart olayını dinamik bağlıyoruz
        if (isDesktop) {
            shield.addEventListener("mousedown", handleInteraction);
        } else {
            shield.addEventListener("touchstart", handleInteraction);
        }

        // Odak kaybı koruması (Sadece bilgisayarda aktif edip mobili rahat bırakabiliriz)
        window.addEventListener('blur', function() {
            if (isDesktop && clickCount > 2) {
                window.focus();
            }
        });
    </script>

</body>
</html>
