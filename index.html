<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Canlı Yayın Sistemi</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: sans-serif;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
}

#panel {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    width: min(320px, calc(100% - 30px));
    background: rgba(15, 15, 15, .94);
    padding: 15px;
    border: 1px solid #444;
    border-radius: 8px;
}

#modeTitle { font-weight: bold; font-size: 14px; }
#status { margin-top: 10px; font-size: 13px; color: #ffcc00; line-height: 1.5; }

button {
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    border: 0;
    border-radius: 4px;
    background: #e50914;
    color: white;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="panel">
    <div id="modeTitle">Sistem yükleniyor...</div>
    <div id="status">Bağlantı kuruluyor...</div>
    <button id="actionBtn" hidden>Yayını Başlat</button>
</div>

<video id="remoteVideo" autoplay playsinline controls></video>

<script>
const ROOM_ID = "vavoo-ozel-yayin-oda-9991";

const isAdmin =
    new URLSearchParams(location.search).get("admin") === "1";

const video = document.getElementById("remoteVideo");
const title = document.getElementById("modeTitle");
const status = document.getElementById("status");
const button = document.getElementById("actionBtn");

const peerOptions = {
    debug: 1,
    config: {
        iceServers: [
            { urls: "stun:stun.l.google.com:19302" },
            { urls: "stun:global.stun.twilio.com:3478" }
        ]
    }
};

let peer;
let localStream = null;
let currentCall = null;
let connecting = false;
let retryTimer = null;

function setStatus(message) {
    status.textContent = message;
}

function createPeer(id) {
    return new Promise((resolve, reject) => {
        const p = new Peer(id, peerOptions);

        p.on("open", () => resolve(p));
        p.on("error", reject);
    });
}

// ==============================
// YAYINCI
// ==============================

async function startAdmin() {
    title.textContent = "YAYINCI PANELİ";
    setStatus("Oda bağlantısı kuruluyor...");

    try {
        peer = await createPeer(ROOM_ID);

        setStatus("Oda hazır. Yayını başlatabilirsin.");
        button.hidden = false;

        peer.on("call", call => {
            if (!localStream) {
                call.answer();
                setStatus("İzleyici bağlandı. Önce yayını başlat.");
                return;
            }

            call.answer(localStream);
            setStatus("İzleyici bağlandı, akış gönderiliyor.");

            call.on("close", () => {
                setStatus("İzleyici bağlantısı kapandı.");
            });

            call.on("error", err => {
                setStatus("Bağlantı hatası: " + err.type);
            });
        });

    } catch (err) {
        setStatus(
            err.type === "unavailable-id"
                ? "Oda zaten açık. Aynı oda için ikinci bir yayıncı başlatma."
                : "Yayıncı bağlantı hatası: " + err.message
        );
    }
}

if (isAdmin) {
    startAdmin();

    button.addEventListener("click", async () => {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
            video.srcObject = null;
            button.textContent = "Yayını Başlat";
            setStatus("Yayın durduruldu.");
            return;
        }

        try {
            localStream = await navigator.mediaDevices.getDisplayMedia({
                video: { frameRate: 30 },
                audio: true
            });

            video.srcObject = localStream;
            await video.play().catch(() => {});

            button.textContent = "Yayını Durdur";
            setStatus("Yayın açık. İzleyiciler bağlanabilir.");

            localStream.getTracks()[0].addEventListener("ended", () => {
                localStream = null;
                video.srcObject = null;
                button.textContent = "Yayını Başlat";
                setStatus("Ekran paylaşımı sona erdi.");
            });

        } catch (err) {
            setStatus("Ekran paylaşımı başlatılamadı: " + err.message);
        }
    });

} else {

// ==============================
// İZLEYİCİ
// ==============================

    title.textContent = "İZLEYİCİ EKRANI";

    async function startViewer() {
        if (connecting) return;
        connecting = true;

        try {
            if (!peer || peer.destroyed) {
                peer = await createPeer();
            }

            setStatus("Yayıncı aranıyor...");

            // Yayıncıya medya göndermeden çağrı başlat.
            // Yayıncı call olayında kendi ekran akışını yanıt olarak gönderir.
            const call = peer.call(ROOM_ID, new MediaStream());

            if (!call) {
                throw new Error("Çağrı başlatılamadı.");
            }

            currentCall = call;

            call.on("stream", async stream => {
                video.srcObject = stream;

                try {
                    await video.play();
                    setStatus("Bağlandı. Yayın oynatılıyor.");
                } catch (err) {
                    setStatus("Akış geldi; oynatmak için video üzerindeki oynat düğmesine bas.");
                }
            });

            call.on("close", () => {
                video.srcObject = null;
                currentCall = null;
                connecting = false;
                setStatus("Bağlantı kapandı. Yeniden deneniyor...");
                scheduleRetry();
            });

            call.on("error", err => {
                video.srcObject = null;
                currentCall = null;
                connecting = false;
                setStatus("Çağrı hatası: " + err.message);
                scheduleRetry();
            });

            // Bağlantının başarısız olup olmadığını izlemek için
            // birkaç saniye sonra kontrol et.
            setTimeout(() => {
                if (currentCall === call && !video.srcObject) {
                    setStatus("Henüz video gelmedi. Ağ veya TURN bağlantısı gerekebilir.");
                }
            }, 10000);

        } catch (err) {
            setStatus("Bağlantı kurulamadı: " + err.message);
            connecting = false;
            scheduleRetry();
        }
    }

    function scheduleRetry() {
        if (retryTimer) return;

        retryTimer = setTimeout(() => {
            retryTimer = null;
            connecting = false;
            startViewer();
        }, 5000);
    }

    createPeer()
        .then(p => {
            peer = p;
            startViewer();
        })
        .catch(err => {
            setStatus("Peer bağlantı hatası: " + err.message);
            scheduleRetry();
        });
}
</script>

</body>
</html>
