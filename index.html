<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Kesintisiz Kilitli Oynatıcı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            overflow: hidden;
        }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="video-wrapper" id="playerContainer">
        <iframe 
            id="streamFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            sandbox="allow-scripts allow-same-origin allow-popups allow-presentation allow-forms"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        window.onload = function() {
            setTimeout(function() {
                const oldFrame = document.getElementById("streamFrame");
                if (!oldFrame) return;

                // Yeni kilitli iframe'i oluşturuyoruz (Eski URL'yi koruyarak)
                const newFrame = document.createElement("iframe");
                newFrame.id = "streamFrame";
                newFrame.src = oldFrame.src; // Yayın asla kopmaz, kaldığı saniyeden devam eder
                
                // Sert Sandbox: allow-popups tamamen kaldırıldı
                newFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
                newFrame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                newFrame.setAttribute("allowfullscreen", "true");

                // Eski iframe'in yerine anında yeni iframe'i koyuyoruz (Tarayıcı önbelleğinden aldığı için yenilenme hissi minimuma iner)
                oldFrame.parentNode.replaceChild(newFrame, oldFrame);

                console.log("5 saniye doldu: Sayfa yenilenmeden Sert Sandbox çakıldı!");
            }, 5 * 1000); // 5 Saniye
        };
    </script>

</body>
</html>
