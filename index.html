<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: absolute;
            top: -60px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 80px);
            border: none;
        }

        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="video-container" id="container">

    <div id="clickShield"></div>

    <!-- Başlangıçta sandboxsuz (player'ın motoru rahatça açılsın diye) -->
    <iframe
        id="playerFrame"
        src="https://dlstreams.st/stream/stream-62.php"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>

<script>
    let clickCount = 0;
    const maxAllowed = 2; // İlk 2 reklama izin ver
    const shield = document.getElementById("clickShield");
    const container = document.getElementById("container");

    function handleInteraction(e) {
        clickCount++;

        if (clickCount <= maxAllowed) {
            // İlk tıklamalarda kalkanı anlık açıp kapatıyoruz
            shield.style.pointerEvents = 'none';
            setTimeout(function() {
                shield.style.pointerEvents = 'auto';
            }, 300);
        }

        // 2. tıklama dolduğu an eski iframe'i yok edip sandbox'lı versiyonunu çakıyoruz
        if (clickCount >= maxAllowed) {
            shield.remove(); // Kalkan tamamen kalkar

            const oldFrame = document.getElementById("playerFrame");
            const currentSrc = oldFrame.src;

            // Eski iframe'i tamamen sök
            oldFrame.remove();

            // Sıfırdan YEPYENİ ve KİLİTLİ sandbox'lı iframe'i yerine koyuyoruz
            const secureFrame = document.createElement("iframe");
            secureFrame.id = "playerFrame";
            secureFrame.src = currentSrc;
            secureFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
            secureFrame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
            secureFrame.setAttribute("allowfullscreen", "true");
            
            // CSS konumlandırması bozulmasın diye aynen bırakıyoruz
            secureFrame.style.position = "absolute";
            secureFrame.style.top = "-60px";
            secureFrame.style.left = "-10px";
            secureFrame.style.width = "calc(100% + 20px)";
            secureFrame.style.height = "calc(100% + 80px)";
            secureFrame.style.border = "none";

            container.appendChild(secureFrame);
        }
    }

    shield.addEventListener("mousedown", handleInteraction);
    shield.addEventListener("touchstart", handleInteraction);
</script>

</body>
</html>
