<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        iframe {
            position: absolute;
            width: 100%;
            height: 160%; 
            top: -30%; 
            border: none;
        }
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <!-- Zincirleme reklamları yutan zaman kilitli kalkan -->
        <div id="clickShield" onclick="blockChainAds()"></div>

        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        let isLocked = false;

        function blockChainAds() {
            var shield = document.getElementById('clickShield');
            
            if (!isLocked) {
                isLocked = true;
                
                // İlk tıklamada ilk reklamın açılmasına izin veriyoruz
                shield.style.pointerEvents = 'none';
                
                // KRİTİK NOKTA: Kaynak sitenin ark arkaya patlattığı zincirleme reklam 
                // dalgasını (3-4 saniye süren saldırıyı) engellemek için kalkanı 
                // kısa bir süre sonra tekrar aktif edip sonra tamamen uçuruyoruz.
                setTimeout(function() {
                    shield.style.pointerEvents = 'auto';
                    
                    // 3 saniye sonra zincir bittiğinde kalkanı tamamen kaldırıyoruz
                    setTimeout(function() {
                        shield.style.display = 'none';
                    }, 3000);
                    
                }, 500);
            }
        }

        // Arkaya kaçmaya çalışan sekmeleri anında geri çeken güvenlik duvarı
        window.addEventListener('blur', function() {
            setTimeout(function() {
                window.focus();
            }, 50);
        });
    </script>

</body>
</html>
