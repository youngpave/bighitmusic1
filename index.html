<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV Oynatıcı</title>
    <!-- Hls.js Kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Videoyu oranını bozmadan ekrana sığdırır */
            background: #000;
        }
    </style>
</head>
<body>

    <video id="videoPlayer" controls autoplay playsinline></video>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var video = document.getElementById('videoPlayer');
            var videoSrc = "https://7jep2q6xee5pjrv.fu8oefd4v2dvlmaarur6crfp.com/sunshine/POAVVY3cDxxW2qMtBSntB6S4zhJf5YynslzbsIk-byksoDC7jgD1c-0VO3f5DbRfUBsBNDbU067Ly_f1k1G9LYg4er6T6tq1HqyjgWFySKnWXYyEd9ZKnwKKpT0SClmJtz7JuqIzgyLZ67BoLv5kmGzRb6_s1Vp7txxMPRTAx_w3DfvdTOjQ1jUvCHNgXfWA_q8GQhq_EfVn6opqSlcMJMh4xYpD30wARG5vsQdAw1jNj4Leh4l_0298fyWvYSa6/hls/index.m3u8";

            if (Hls.isSupported()) {
                var hls = new Hls({
                    // Akış kopmalarını önlemek için tampon ve kurtarma ayarları
                    maxBufferLength: 30,
                    liveSyncDurationCount: 3
                });
                hls.loadSource(videoSrc);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(error => {
                        console.log("Otomatik oynatma tarayıcı tarafından engellendi:", error);
                    });
                });
            } 
            // Safari gibi yerel HLS desteği olan tarayıcılar için
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSrc;
                video.addEventListener('loadedmetadata', function() {
                    video.play().catch(error => {
                        console.log("Otomatik oynatma engellendi:", error);
                    });
                });
            }
        });
    </script>

</body>
</html>
