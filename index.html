<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bein Sports 1 - Canlı Akış</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: Arial, sans-serif;
        }
        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* Özel Canlı Rozeti ve Alt Bar */
        .custom-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .player-container:hover .custom-controls {
            opacity: 1;
        }
        .live-badge {
            display: flex;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ff3b30;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #ff3b30;
            animation: pulse 1.5s infinite;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="player-container">
        <!-- controls özniteliğini sildik, tamamen özel rozet kullanıyoruz -->
        <video id="video" autoplay playsinline></video>
        
        <div class="custom-controls">
            <div class="live-badge">
                <div class="live-dot"></div> CANLI
            </div>
            <div class="btn-group">
                <button class="ctrl-btn" onclick="togglePlay()">Oynat / Durdur</button>
                <button class="ctrl-btn" onclick="toggleMute()">Sesi Aç / Kapat</button>
                <button class="ctrl-btn" onclick="goLive()">Canlıya Dön</button>
            </div>
        </div>
    </div>

    <script>
        var video = document.getElementById('video');
        var videoSrc = 'https://vix.ijekhaje.xyz/tflix/secure/f9aba2a0c046b78cedda92145f222969bb3fe9b81724124fb6cb1c0dcb86fe86/1791388261/bein1tr.m3u8';

        if (Hls.isSupported()) {
            var hlsConfig = {
                // Yayını net 40 saniye geriden başlat ve o mesafeyi koru
                liveSyncDuration: 40,
                liveMaxLatencyDuration: 60,
                maxBufferLength: 90,
                maxMaxBufferLength: 180,
                fragLoadingTimeOut: 15000,
                manifestLoadingTimeOut: 15000
            };

            var hls = new Hls(hlsConfig);
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(e => {
                    video.muted = true;
                    video.play();
                });
            });

            // Akış senkronizasyonu için yardımcı fonksiyon
            window.goLive = function() {
                if (hls.liveSyncPosition) {
                    video.currentTime = hls.liveSyncPosition;
                }
            };
            
            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        hls.startLoad();
                    } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        hls.recoverMediaError();
                    } else {
                        hls.destroy();
                    }
                }
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }

        function togglePlay() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }

        function toggleMute() {
            video.muted = !video.muted;
        }
    </script>

</body>
</html>
