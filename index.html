<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Akıllı Tazeleme Koruması</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-box {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Takılmalara karşı ekranın köşesine mini tazeleme butonu */
        .refresh-btn {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            z-index: 9999;
            opacity: 0.3;
            transition: opacity 0.3s;
        }
        .refresh-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-box" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı -->
            <iframe 
                id="streamFrame"
                src="https://dlstreams.st/watch/stream-62.php" 
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <!-- Takılma anında anında yayın akışını tazeleyen gizli/hafif buton -->
    <button class="refresh-btn" onclick="reloadStream()">Yayın Takıldıysa Tıkla</button>

    <script>
        function reloadStream() {
            const container = document.getElementById("playerContainer");
            let frame = document.getElementById("streamFrame");
            if (frame) {
                const currentSrc = frame.src;
                frame.remove(); // Eski donmuş iframe'i uçur
                
                const newFrame = document.createElement("iframe");
                newFrame.id = "streamFrame";
                newFrame.src = currentSrc;
                newFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms allow-popups-to-escape-sandbox");
                newFrame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                newFrame.setAttribute("allowfullscreen", "true");
                
                container.appendChild(newFrame);
            }
        }

        (function() {
            reloadStream(); // İlk açılışta güvenli sandbox ile kur
        })();
    </script>
</body>
</html>
