<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: absolute;
            top: -60px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 80px);
            border: none;
        }

        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="video-container">

    <div id="clickShield"></div>

    <iframe
        id="playerFrame"
        src="https://dlstreams.st/stream/stream-62.php"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>

<script>
    let clickCount = 0;
    const maxAllowed = 1;
    const shield = document.getElementById("clickShield");

    // Yeni sekme ve pop-up açma girişimlerini kökten kesen duvar
    window.open = function() {
        return null;
    };

    // Ortak etkileşim fonksiyonu (Hem tıklama hem dokunmayı aynı anda yakalar)
    function handleInteraction(e) {
        clickCount++;

        if (clickCount <= maxAllowed) {
            shield.style.pointerEvents = 'none';
            setTimeout(function() {
                shield.style.pointerEvents = 'auto';
            }, 1000); // Sızıntıları engelleyen güçlü kalkan süresi
        } else {
            shield.remove();
        }
    }

    // Bilgisayar ve telefon için her iki olayı da dinle
    shield.addEventListener("click", handleInteraction);
    shield.addEventListener("touchstart", handleInteraction);

    // Bilgisayarın o sinsi sekme fırlatmalarında sayfayı geri çeken odak koruması
    window.addEventListener('blur', function() {
        if (clickCount > maxAllowed) {
            window.focus();
        }
    });
</script>

</body>
</html>
