
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        
        /* Iframe'i doğrudan tam ekran yapıyoruz */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;  
            height: 100%; 
            border: none;
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <!-- 
          SİHİRLİ KISIM BURASI: sandbox="allow-scripts allow-same-origin allow-presentation" 
          Bu sayede site videoyu oynatabilir (scripts ve presentation) ama yeni sekme açamaz, 
          pop-up fırlatamaz, yönlendirme yapamaz!
        -->
        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            sandbox="allow-scripts allow-same-origin allow-presentation allow-forms"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

</body>
</html>
