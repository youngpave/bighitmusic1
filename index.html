<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Yayın Sistemi</title>
    <!-- PeerJS Kütüphanesi -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; font-family: sans-serif; }
        video { width: 100%; height: 100%; object-fit: contain; }
        #adminControls {
            display: none; position: absolute; top: 20px; left: 20px; z-index: 1000;
            background: rgba(15, 15, 15, 0.95); padding: 15px; border-radius: 8px; border: 1px solid #333;
        }
        button { background: #e50914; color: #fff; border: none; padding: 10px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }
        #status { margin-top: 8px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

    <div id="adminControls">
        <button id="startBtn">Yayını Başlat (Sekme Seç)</button>
        <div id="status">Bekleniyor...</div>
    </div>

    <video id="remoteVideo" autoplay playsinline controls></video>

    <script>
        // Herkesin bağlanacağı sabit ve benzersiz oda ID'si
        const ROOM_ID = "vavoo-ozel-yayin-kanal-2026";
        
        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === '1';

        const videoEl = document.getElementById('remoteVideo');
        const adminControls = document.getElementById('adminControls');
        const startBtn = document.getElementById('startBtn');
        const statusDiv = document.getElementById('status');

        // Güçlü STUN sunucuları (Ağ engellerini aşmak için şart)
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        };

        if (isAdmin) {
            adminControls.style.display = 'block';
            let peer = new Peer(ROOM_ID, peerConfig);
            let localStream = null;

            peer.on('open', () => {
                statusDiv.innerText = "Yayın odası açıldı. Butona basabilirsiniz.";
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    statusDiv.innerText = "Hata: Bu oda zaten açık başka sekme kapatın.";
                } else {
                    statusDiv.innerText = "Hata: " + err.type;
                }
            });

            peer.on('call', (call) => {
                if (localStream) {
                    call.answer(localStream);
                    statusDiv.innerText = "YAYINDA: İzleyici bağlandı!";
                } else {
                    call.answer();
                }
            });

            startBtn.addEventListener('click', async () => {
                try {
                    localStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { cursor: "always", frameRate: 30 },
                        audio: true
                    });

                    videoEl.srcObject = localStream;
                    statusDiv.innerText = "YAYINDA: İzleyiciler bekleniyor...";

                    localStream.getVideoTracks()[0].onended = () => {
                        statusDiv.innerText = "Yayın sonlandırıldı.";
                        videoEl.srcObject = null;
                        localStream = null;
                    };
                } catch (e) {
                    statusDiv.innerText = "Paylaşım iptal edildi.";
                }
            });

        } else {
            // İzleyici Tarafı
            let peer = new Peer(peerConfig);

            function connectToStream() {
                statusDiv.innerText = "Yayına bağlanmaya çalışılıyor...";
                const call = peer.call(ROOM_ID, new MediaStream());

                call.on('stream', (stream) => {
                    videoEl.srcObject = stream;
                    videoEl.play().catch(() => {});
                });

                call.on('close', () => {
                    setTimeout(connectToStream, 3000); // Koptuğunda tekrar dene
                });
            }

            peer.on('open', () => {
                connectToStream();
            });

            peer.on('error', () => {
                setTimeout(connectToStream, 3000);
            });
        }
    </script>
</body>
</html>
