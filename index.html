<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Reklam Kilitlenmesi Korumalı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-box {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-box" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı -->
            <iframe 
                id="streamFrame"
                src="https://dlstreams.st/watch/stream-62.php" 
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById("playerContainer");

            // Player'ı sıfırdan taptaze kuran fonksiyon
            function cleanReset() {
                let frame = document.getElementById("streamFrame");
                const url = "https://dlstreams.st/watch/stream-62.php";
                
                if (frame) {
                    frame.remove(); // Donan/kilitlenen eski iframe'i uçur
                }

                const newFrame = document.createElement("iframe");
                newFrame.id = "streamFrame";
                newFrame.src = url;
                
                // Reklam döngülerinin patlamasına ve açılmasına izin veren ama player'ı boğmayan yapı
                newFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups allow-presentation allow-forms");
                
                newFrame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                newFrame.setAttribute("allowfullscreen", "true");
                
                container.appendChild(newFrame);
            }

            // İlk açılış
            cleanReset();

            // SIKI KORUMA: O 6 reklamın üst üste binip player'ı kilitlediği durumlara karşı 
            // düzenli aralıklarla (örneğin her 10 dakikada bir) player'ı otomatik tazeleyerek 
            // reklamların yığılmasını ve donmasını engeller.
            setInterval(function() {
                console.log("Reklam yığılması önleniyor, akış taze otrosfere sokuluyor...");
                cleanReset();
            }, 10 * 60 * 1000); // 10 dakikada bir otomatik tertemiz başlangıç
        })();
    </script>
</body>
</html>
