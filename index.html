
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: absolute;
            top: -60px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 80px);
            border: none;
        }

        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="video-container" id="container">

    <div id="clickShield"></div>

    <iframe
        id="playerFrame"
        src="https://dlstreams.st/stream/stream-62.php"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>

<script>
    let clickCount = 0;
    const maxAllowed = 1; // İlk patlamadan sonra kalkan süresi devreye girer
    const shield = document.getElementById("clickShield");
    const container = document.getElementById("container");

    // Mobil mi bilgisayar mı tespiti
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    // Yeni sekme açma girişimlerini kökten kesen duvar
    window.open = function() {
        return null;
    };

    function handleInteraction(e) {
        clickCount++;

        if (clickCount <= maxAllowed) {
            shield.style.pointerEvents = 'none';
            setTimeout(function() {
                shield.style.pointerEvents = 'auto';
            }, 1000);
        } else {
            // Sınır dolunca kalkan kalkar
            shield.remove();

            // 🖥️ BİLGİSAYARA ÖZEL HAMLE: Sandbox'ı devreye sokuyoruz!
            if (!isMobile) {
                const oldFrame = document.getElementById("playerFrame");
                if (oldFrame) {
                    const currentSrc = oldFrame.src;
                    oldFrame.remove();

                    // Bilgisayarda player zaten açıldığı için sandbox'lı versiyonu güvenle dikilir
                    const secureFrame = document.createElement("iframe");
                    secureFrame.id = "playerFrame";
                    secureFrame.src = currentSrc;
                    secureFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
                    secureFrame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                    secureFrame.setAttribute("allowfullscreen", "true");
                    
                    secureFrame.style.position = "absolute";
                    secureFrame.style.top = "-60px";
                    secureFrame.style.left = "-10px";
                    secureFrame.style.width = "calc(100% + 20px)";
                    secureFrame.style.height = "calc(100% + 80px)";
                    secureFrame.style.border = "none";

                    container.appendChild(secureFrame);
                }
            }
        }
    }

    // Olay dinleyicileri
    shield.addEventListener("click", handleInteraction);
    shield.addEventListener("touchstart", handleInteraction);

    // Bilgisayar odak koruması
    window.addEventListener('blur', function() {
        if (clickCount > maxAllowed) {
            window.focus();
        }
    });
</script>

</body>
</html>
