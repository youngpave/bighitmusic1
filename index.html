<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: absolute;
            top: -60px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 80px);
            border: none;
        }

        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="video-container" id="container">

    <div id="clickShield"></div>

    <iframe
        id="playerFrame"
        src="https://dlstreams.st/stream/stream-62.php"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>

<script>
    const shield = document.getElementById("clickShield");

    // Yeni sekme ve pop-up açma girişimlerini kökten kesen duvar
    window.open = function() {
        return null;
    };

    // Aradan günler geçse bile unutulmayan kalıcı hafıza tabanlı sayaç (İki cihaz için ortak)
    let clickCount = parseInt(localStorage.getItem('mactv_exact_two_ads') || '0');
    const maxAllowed = 2; // İzin verilen maksimum reklam sınırı

    if (clickCount >= maxAllowed) {
        // Eğer daha önce o 2 reklam hakkı dolduysa, kalkan hiç çıkmaz ve reklamsız/kalıntısız devam eder
        shield.remove();
    } else {
        // Etkileşim yakalama fonksiyonu (Hem bilgisayar 'click' hem telefon 'touchstart' desteği)
        function handleAdsControl(e) {
            clickCount++;
            localStorage.setItem('mactv_exact_two_ads', clickCount);

            if (clickCount < maxAllowed) {
                // İlk reklamdan sonra sitenin ikinci reklamı fırlatabilmesi için kalkanı kısa bir süre (1 saniye) kilitleyip açıyoruz
                shield.style.pointerEvents = 'none';
                setTimeout(function() {
                    shield.style.pointerEvents = 'auto';
                }, 1000);
            } else {
                // 2. reklam hakkı da dolduğu an kalkan tamamen uçurulur ve kapılar kapatılır
                shield.remove();
            }
        }

        shield.addEventListener("click", handleAdsControl);
        shield.addEventListener("touchstart", handleAdsControl);
    }

    // Bilgisayar odak koruması (Arka plana sekme atma trick'lerini engeller)
    window.addEventListener('blur', function() {
        if (clickCount >= maxAllowed) {
            window.focus();
        }
    });
</script>

</body>
</html>
