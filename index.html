<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        /* Orijinal normal boyutuna döndürüldü */
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Tıklama kontrol kalkanı */
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <div id="clickShield"></div>

        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        let clickCounter = 0;
        const maxAllowed = 2; // Kesin sınır (Maksimum 2 reklam)
        const shield = document.getElementById('clickShield');

        function handleInteraction(e) {
            clickCounter++;
            
            if (clickCounter <= maxAllowed) {
                shield.style.pointerEvents = 'none';
                setTimeout(function() {
                    shield.style.pointerEvents = 'auto';
                }, 300);
            } else {
                shield.style.display = 'none';
            }
        }

        shield.addEventListener('mousedown', handleInteraction);
        shield.addEventListener('click', handleInteraction);

        window.addEventListener('blur', function() {
            if (clickCounter > maxAllowed) {
                window.focus();
            }
        });
    </script>

</body>
</html>
