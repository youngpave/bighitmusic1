<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Sert Koruma Modu</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-box {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-box" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı -->
            <iframe 
                id="streamFrame"
                src="https://dlstreams.st/watch/stream-62.php" 
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        (function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const container = document.getElementById("playerContainer");
            let frame = document.getElementById("streamFrame");

            if (frame) {
                const src = frame.src;
                frame.remove();

                const secureFrameElem = document.createElement("iframe");
                secureFrameElem.id = "streamFrame";
                secureFrameElem.src = src;

                if (!isMobile) {
                    // 🖥️ BİLGİSAYAR İÇİN: En sert sandbox duvarı (Asla açık vermez)
                    secureFrameElem.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
                } else {
                    // 📱 TELEFON İÇİN: İlk tıklamanın çalışması ve sadece 1 reklamın çıkmasına izin veren sert yapı
                    secureFrameElem.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups allow-presentation allow-forms");
                }
                
                secureFrameElem.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                secureFrameElem.setAttribute("allowfullscreen", "true");
                
                container.appendChild(secureFrameElem);
            }
        })();
    </script>
</body>
</html>
