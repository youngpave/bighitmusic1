<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        /* Yayın alanını ortalayıp reklam kalabalığını dışarıda bırakan yapı */
        iframe {
            position: absolute;
            width: 100%;
            height: 160%; 
            top: -30%; 
            border: none;
        }
        /* Tıklama başına reklamı sayıp denetleyen akıllı kalkan */
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <!-- Kaçak reklamları tokatlayan kalkan -->
        <div id="clickShield" onclick="strictAdControl()"></div>

        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        let clickCounter = 0;
        const limit = 2; // Kesin sınır: Maksimum 2'yi geçmeyecek!

        function strictAdControl() {
            clickCounter++;
            var shield = document.getElementById('clickShield');
            
            if (clickCounter <= limit) {
                // İzin verilen ilk 1-2 tıklamada reklamın geçmesine izin ver, 
                // ama hızlıca kalkanı çekip geri koyarak zinciri kır
                shield.style.pointerEvents = 'none';
                setTimeout(function() {
                    shield.style.pointerEvents = 'auto';
                }, 400);
            } else {
                // Sınır aşıldığı an kalkan tamamen kilitlenir ve 
                // arkaya fırlamaya çalışan fazlalık tüm sekmeleri anında geri çeker
                shield.style.display = 'none';
            }
        }

        // Kaçak sekmeleri ve odak kayıplarını anında yakalayıp kendi sayfana çeken sert duvar
        window.addEventListener('blur', function() {
            if (clickCounter > limit) {
                window.focus();
            }
        });
    </script>

</body>
</html>
