<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Kusursuz Mobil Oynatıcı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            overflow: hidden;
        }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 
          📱 MOBİL REKLAM KALKANI:
          Başlangıçta tamamen etkisizdir (pointer-events: none), yani videoyu rahatça oynatabilirsin.
          Süre dolunca aktifleşir ama sadece reklam tetikleyen boşlukları kapatır.
        */
        #mobileShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            pointer-events: none; /* İlk başta tıklamaları doğrudan alta (videoya) geçirir */
        }
    </style>
</head>
<body>

    <div class="video-wrapper" id="playerContainer">
        <div id="mobileShield"></div>
        <iframe 
            id="streamFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            sandbox="allow-scripts allow-same-origin allow-popups allow-presentation allow-forms"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        window.onload = function() {
            // İlk 6 saniye (2 reklam süresi) yayın rahatça yüklenir ve açılır.
            setTimeout(function() {
                const shield = document.getElementById("mobileShield");
                if (shield) {
                    // Süre dolunca kalkan katılaşır ve arka planda yeni sekme açılmasını tetikleyecek 
                    // tüm sahte tıklama girişimlerini bloke eder.
                    shield.style.pointerEvents = "auto";
                    console.log("Mobil reklam kalkanı kilitlendi, tıkanma yok!");
                }
            }, 6 * 1000); // 6 Saniye
        };
    </script>

</body>
</html>
