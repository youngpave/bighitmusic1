<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bein Sports 1 - 40 Saniye Gecikmeli Mod</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        video { width: 100vw; height: 100vh; border: none; }
    </style>
</head>
<body>

    <video id="video" controls autoplay playsinline></video>

    <script>
        var video = document.getElementById('video');
        var videoSrc = 'https://vix.ijekhaje.xyz/tflix/secure/f9aba2a0c046b78cedda92145f222969bb3fe9b81724124fb6cb1c0dcb86fe86/1791388261/bein1tr.m3u8';

        if (Hls.isSupported()) {
            var hlsConfig = {
                // Yayını tam 40 saniye geriden (delay ile) başlat ve o mesafeyi koru
                liveSyncDuration: 40,
                liveMaxLatencyDuration: 60,
                
                // 40 saniyelik gecikmeyi rahatça depolayabilmesi için tampon boyutu
                maxBufferLength: 90,
                maxMaxBufferLength: 180,

                // Sunucu kopmalarına karşı esnek zaman aşımı
                fragLoadingTimeOut: 20000,
                manifestLoadingTimeOut: 20000
            };

            var hls = new Hls(hlsConfig);
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(e => {
                    video.muted = true;
                    video.play();
                });
            });
            
            // Hata anında akışı koparmadan devam ettirme
            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        hls.startLoad();
                    } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        hls.recoverMediaError();
                    } else {
                        hls.destroy();
                    }
                }
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
