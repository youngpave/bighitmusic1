<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Tam Otomatik & Korumalı Oynatıcı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-box {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-box" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı -->
            <iframe 
                id="streamFrame"
                src="https://dlstreams.st/watch/stream-62.php" 
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById("playerContainer");

            // Otomatik Player Kurulum ve Tazeleme Fonksiyonu
            function initPlayer() {
                let frame = document.getElementById("streamFrame");
                let currentSrc = frame ? frame.src : "https://dlstreams.st/watch/stream-62.php";
                
                if (frame) {
                    frame.remove();
                }

                const secureFrameElem = document.createElement("iframe");
                secureFrameElem.id = "streamFrame";
                secureFrameElem.src = currentSrc;
                
                // Sandbox zırhı: Reklamların yeni sekme açmasını engeller, player'ı boğmaz
                secureFrameElem.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms allow-popups-to-escape-sandbox");
                secureFrameElem.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                secureFrameElem.setAttribute("allowfullscreen", "true");
                
                container.appendChild(secureFrameElem);
            }

            // İlk açılışta güvenli sandbox ile başlat
            initPlayer();

            // OTOMATİK NÖBETÇİ & CANLANDIRICI: 
            // Yayın sunucularının time-out (zaman aşımı) sürelerini sıfırlamak ve takılmaları önlemek için 
            // arka planda hiçbir şeye dokunmana gerek kalmadan player'ı otomatik tazeler.
            // (Maç keyfini bölmeyecek şekilde uzun ve ideal bir periyotta çalışır)
            setInterval(function() {
                console.log("MaçTV: Akış tazeleniyor, player tıkınması engelleniyor...");
                initPlayer();
            }, 30 * 60 * 1000); // Her 30 dakikada bir arka planda otomatik tertemiz yeniler
        })();
    </script>
</body>
</html>
