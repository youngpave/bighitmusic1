<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bein Sports 1 - Sade Oynatıcı</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: Arial, sans-serif;
        }
        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* Minimalist Kontrol Paneli */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .player-container:hover .custom-controls {
            opacity: 1;
        }
        /* İlerleme (Geriye Sarma) Çubuğu */
        .seek-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            cursor: pointer;
            appearance: none;
            outline: none;
        }
        .seek-bar::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            background: #ff3b30;
            border-radius: 50%;
            cursor: pointer;
        }
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .left-group, .right-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .live-badge {
            display: flex;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ff3b30;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 6px #ff3b30;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="player-container" id="playerContainer">
        <video id="video" autoplay playsinline></video>
        
        <div class="custom-controls">
            <!-- Geriye sarma çubuğu -->
            <input type="range" id="seekBar" class="seek-bar" value="0" max="100" step="0.1">
            
            <div class="controls-row">
                <div class="left-group">
                    <button class="ctrl-btn" id="playBtn" onclick="togglePlay()">Durdur</button>
                    <div class="live-badge" onclick="goLive()" title="Canlıya dönmek için tıkla">
                        <div class="live-dot"></div> CANLI
                    </div>
                </div>
                <div class="right-group">
                    <button class="ctrl-btn" onclick="toggleFullscreen()">Tam Ekran</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        var video = document.getElementById('video');
        var playBtn = document.getElementById('playBtn');
        var seekBar = document.getElementById('seekBar');
        var playerContainer = document.getElementById('playerContainer');
        
        // Yeni eklediğin taze link
        var videoSrc = 'https://vix.ijekhaje.xyz/tflix/secure/06a2a7fc2004144c88af584dcdc1ff7547ce841f5ba9e1453d2eec06d211a69d/1791398417/bein1tr.m3u8';

        if (Hls.isSupported()) {
            var hlsConfig = {
                // Yayını 50 saniye geriden başlat ve geniş tampon tut
                liveSyncDuration: 50,
                liveMaxLatencyDuration: 120,
                maxBufferLength: 180,
                maxMaxBufferLength: 360,
                fragLoadingTimeOut: 20000,
                manifestLoadingTimeOut: 20000
            };

            var hls = new Hls(hlsConfig);
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(e => {
                    video.muted = true;
                    video.play();
                });
            });

            // Zaman çubuğunu güncelle (Geriye sarma aralığını takip et)
            video.addEventListener('timeupdate', function() {
                if (video.duration) {
                    var percent = (video.currentTime / video.duration) * 100;
                    seekBar.value = percent;
                }
            });

            // Çubuktan ileri/geri sarma işlemi
            seekBar.addEventListener('input', function() {
                if (video.duration) {
                    var time = (seekBar.value / 100) * video.duration;
                    video.currentTime = time;
                }
            });

            hls.on(Hls.Events.ERROR, function(event, data) {
                if (data.fatal) {
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        hls.startLoad();
                    } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        hls.recoverMediaError();
                    } else {
                        hls.destroy();
                    }
                }
            });
        } 
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }

        function togglePlay() {
            if (video.paused) {
                video.play();
                playBtn.innerText = "Durdur";
            } else {
                video.pause();
                playBtn.innerText = "Oynat";
            }
        }

        // Canlı rozetine basınca en güncel ana geri döner
        function goLive() {
            if (video.buffered.length > 0) {
                video.currentTime = video.buffered.end(video.buffered.length - 1);
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                playerContainer.requestFullscreen().catch(err => {
                    console.log("Tam ekran hatası: ", err.message);
                });
            } else {
                document.exitFullscreen();
            }
        }
    </script>

</body>
</html>
