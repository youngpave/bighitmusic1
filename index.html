<script>
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

const container = document.getElementById('container');
const shield = document.getElementById('clickShield');
const oldFrame = document.getElementById('playerFrame');

if (!isMobile) {

    if (oldFrame) {
        const currentSrc = oldFrame.src;
        oldFrame.remove();

        const secureFrame = document.createElement("iframe");

        secureFrame.id = "playerFrame";
        secureFrame.src = currentSrc;

        secureFrame.setAttribute(
            "sandbox",
            "allow-scripts allow-same-origin allow-presentation allow-forms"
        );

        secureFrame.setAttribute(
            "allow",
            "autoplay; fullscreen; encrypted-media; picture-in-picture"
        );

        secureFrame.setAttribute("allowfullscreen", "true");

        secureFrame.style.position = "absolute";
        secureFrame.style.top = "0";
        secureFrame.style.left = "0";
        secureFrame.style.width = "100%";
        secureFrame.style.height = "100%";
        secureFrame.style.border = "none";

        container.appendChild(secureFrame);
    }

    shield.remove();

} else {

    const STORAGE_KEY = "mactv_ad_counter";
    const MAX_CLICKS = 2;

    let clickCounter = Number(localStorage.getItem(STORAGE_KEY) || 0);

    // Daha önce 2 kez kullanılmışsa kalkanı hiç oluşturma
    if (clickCounter >= MAX_CLICKS) {
        shield.remove();
    } else {

        shield.addEventListener("touchstart", function handleTouch(e) {

            clickCounter++;

            localStorage.setItem(
                STORAGE_KEY,
                String(clickCounter)
            );

            // 2. dokunuştan sonra kalkan tamamen kalkar
            if (clickCounter >= MAX_CLICKS) {
                shield.remove();
                return;
            }

            // İlk dokunuştan sonra kısa süre dokunmayı engelle
            shield.style.pointerEvents = "none";

            setTimeout(() => {
                if (shield && shield.parentNode) {
                    shield.style.pointerEvents = "auto";
                }
            }, 1200);

        }, { passive: true });
    }
}
</script>
