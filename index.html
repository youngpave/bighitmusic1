<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-box {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>

<body>

<div class="app-container">
    <div class="player-box" id="playerContainer">

        <iframe
            id="streamFrame"
            src="https://dlstreams.st/watch/stream-62.php"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>
</div>

<script>
(function () {

    const isMobile =
        /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i
        .test(navigator.userAgent);

    const container = document.getElementById("playerContainer");
    const oldFrame = document.getElementById("streamFrame");

    if (!oldFrame) return;

    const src = oldFrame.src;

    oldFrame.remove();

    function createPlayer() {

        const frame = document.createElement("iframe");

        frame.id = "streamFrame";
        frame.src = src;

        if (!isMobile) {

            frame.setAttribute(
                "sandbox",
                "allow-scripts allow-same-origin allow-presentation allow-forms"
            );

        } else {

            frame.setAttribute(
                "sandbox",
                "allow-scripts allow-same-origin allow-popups allow-presentation allow-forms"
            );

        }

        frame.setAttribute(
            "allow",
            "autoplay; fullscreen; encrypted-media; picture-in-picture"
        );

        frame.setAttribute("allowfullscreen", "true");

        container.appendChild(frame);
    }

    // İlk player
    createPlayer();


    /*
     * 3 DAKİKADA BİR PLAYER YENİLEME
     *
     * Ana sayfa yenilenmez.
     * Sadece iframe yeniden oluşturulur.
     */

    setInterval(function () {

        const currentFrame =
            document.getElementById("streamFrame");

        if (!currentFrame) return;

        currentFrame.remove();

        createPlayer();

    }, 3 * 60 * 1000);

})();
</script>

</body>
</html>
