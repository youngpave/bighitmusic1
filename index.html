<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: Arial, sans-serif;
        }
        .player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* Minimalist Kontrol Paneli */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .player-container:hover .custom-controls {
            opacity: 1;
        }
        /* İlerleme (Geriye Sarma) Çubuğu */
        .seek-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
            cursor: pointer;
            appearance: none;
            outline: none;
        }
        .seek-bar::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            background: #ff3b30;
            border-radius: 50%;
            cursor: pointer;
        }
        .controls-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .left-group, .right-group {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .ctrl-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .live-badge {
            display: flex;
            align-items: center;
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 1px;
            cursor: pointer;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ff3b30;
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 6px #ff3b30;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
    </style>
</head>

                    </div>
                </div>
                <div class="right-group">
                    <button class="ctrl-btn" onclick="toggleFullscreen()">Tam Ekran</button>
                </div>
            </div>
        </div>
    </div>
