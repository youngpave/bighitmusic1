<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Ekrandaki banner ve tıklama reklamlarını bloke eden kalıcı/akıllı kalkan */
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: rgba(0, 0, 0, 0.01); /* Neredeyse tamamen şeffaf ama tıklamaları yakalar */
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <!-- Ekranı kaplayan reklamları engelleyen kalkan -->
        <div id="clickShield" onclick="handleScreenClick()"></div>

        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        let clickCount = 0;

        function handleScreenClick() {
            clickCount++;
            var shield = document.getElementById('clickShield');
            
            if (clickCount === 1) {
                // İlk tıklamada o zorunlu ilk reklamın açılmasına izin verip kalkanı pasifize ediyoruz
                shield.style.pointerEvents = 'none';
                setTimeout(function() {
                    shield.style.display = 'none';
                }, 300);
            }
        }

        // Ekrandaki reklamların yeni sekme açma girişimlerini anında yakalayıp geri çeken duvar
        window.addEventListener('blur', function() {
            setTimeout(function() {
                window.focus();
            }, 50);
        });
    </script>

</body>
</html>
