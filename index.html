<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Kesintisiz Geçiş</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-box {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-box" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı (Başlangıçta esnek modda yüklenir) -->
            <iframe 
                id="streamFrame"
                src="https://dlstreams.st/watch/stream-62.php" 
                sandbox="allow-scripts allow-same-origin allow-popups allow-presentation allow-forms"
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        (function() {
            // Tam 3 saniye sonra oynatıcıya hiç dokunmadan, sayfayı yenilemeden 
            // arka planda sert sandbox kuralını doğrudan çakıyoruz.
            setTimeout(function() {
                const frame = document.getElementById("streamFrame");
                if (frame) {
                    // Sert sandbox: pop-up izinleri tamamen sökülür, reklamlar sıfırlanır
                    frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
                    console.log("Sert Sandbox sessizce devreye girdi, akış bozulmadı!");
                }
            }, 3 * 1000); // 3 saniye
        })();
    </script>
</body>
</html>
