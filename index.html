<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaçTV - Canlı Yayın</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        #playerFrame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        #clickShield {
            position: absolute;
            inset: 0;
            z-index: 999;
            background: transparent;
        }
    </style>
</head>

<body>

<div class="video-container" id="container">

    <div id="clickShield"></div>

    <iframe
        id="playerFrame"
        src="https://dlstreams.st/watch/stream-62.php"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>

<script>
(function () {

    const frame = document.getElementById("playerFrame");
    const shield = document.getElementById("clickShield");

    const isMobile =
        /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i
        .test(navigator.userAgent);


    /* =========================
       📱 TELEFON
       ========================= */

    if (isMobile) {

        const KEY = "mactv_counter";
        const MAX = 2;

        let count = 0;

        try {

            const localVal = localStorage.getItem(KEY);
            const nameVal = window.name;

            if (localVal) {
                count = parseInt(localVal, 10);

            } else if (nameVal && !isNaN(nameVal)) {
                count = parseInt(nameVal, 10);
            }

        } catch (e) {
            count = 0;
        }


        /* Sayaç zaten doluysa kalkan yok */

        if (count >= MAX) {

            shield.remove();

        } else {

            shield.addEventListener(
                "touchstart",
                function () {

                    count++;

                    try {
                        localStorage.setItem(KEY, count);
                        window.name = count.toString();
                    } catch (e) {}


                    /* 2. etkileşimden sonra kalkan tamamen kalkar */

                    if (count >= MAX) {

                        shield.remove();

                        return;
                    }


                    /* İlk etkileşimden sonra kısa bekleme */

                    shield.style.pointerEvents = "none";

                    setTimeout(function () {

                        if (shield && shield.parentNode) {
                            shield.style.pointerEvents = "auto";
                        }

                    }, 1200);

                },
                { passive: true }
            );
        }

    }


    /* =========================
       🖥️ BİLGİSAYAR
       ========================= */

    else {

        const src = frame.src;

        const secureFrame =
            document.createElement("iframe");

        secureFrame.id = "playerFrame";
        secureFrame.src = src;

        secureFrame.setAttribute(
            "sandbox",
            "allow-scripts allow-same-origin allow-presentation allow-forms"
        );

        secureFrame.setAttribute(
            "allow",
            "autoplay; fullscreen; encrypted-media; picture-in-picture"
        );

        secureFrame.setAttribute(
            "allowfullscreen",
            "true"
        );

        secureFrame.style.position = "absolute";
        secureFrame.style.inset = "0";
        secureFrame.style.width = "100%";
        secureFrame.style.height = "100%";
        secureFrame.style.border = "0";


        frame.replaceWith(secureFrame);

        shield.remove();
    }

})();
</script>

</body>
</html>
