<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Yayın Sistemi</title>
    <!-- WebRTC Yönetimi için PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #0f0f0f;
            color: #fff;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        /* Admin Paneli */
        #adminControls {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(20, 20, 20, 0.9);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #333;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        button {
            background: #e50914;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #b80710;
        }
        #status {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- Admin Paneli (Sadece ?admin=1 ile açıldığında görünür) -->
    <div id="adminControls">
        <button id="startScreenBtn">Canlı Yayın Başlat (Sekme Seç)</button>
        <div id="status">Admin Modu: Bekleniyor...</div>
    </div>

    <!-- Yayın Görüntüleme Alanı -->
    <video id="remoteVideo" autoplay playsinline controls></video>

    <script>
        // Sabit Oda Adı (Kendi odanı belirleyebilirsin)
        const ADMIN_PEER_ID = "xstream-özel-yayin-odasi-2026";

        const urlParams = new URLSearchParams(window.location.search);
        const isAdmin = urlParams.get('admin') === '1';

        const videoElement = document.getElementById('remoteVideo');
        const adminControls = document.getElementById('adminControls');
        const startScreenBtn = document.getElementById('startScreenBtn');
        const statusDiv = document.getElementById('status');

        if (isAdmin) {
            // --- YAYINCI (ADMIN) TARAFI ---
            adminControls.style.display = 'block';
            
            const peer = new Peer(ADMIN_PEER_ID);

            peer.on('open', (id) => {
                statusDiv.innerText = "Bağlantı hazır. Butona basıp yayın akışını seçin.";
            });

            let localStream = null;

            // İzleyici bağlandığında yayını aktar
            peer.on('call', (call) => {
                if (localStream) {
                    call.answer(localStream);
                } else {
                    call.answer();
                }
            });

            startScreenBtn.addEventListener('click', async () => {
                try {
                    // Bilgisayarı yormamak için sadece SEKME veya PENCERE seçilmesi önerilir
                    localStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { 
                            cursor: "always",
                            frameRate: { ideal: 30, max: 30 } // İşlemciyi yormamak için FPS sınırı
                        },
                        audio: true // Ses aktarımı (Destekleyen tarayıcılarda sekme sesi gider)
                    });

                    videoElement.srcObject = localStream;
                    statusDiv.innerText = "YAYINDA: İzleyiciler bağlanıyor...";

                    // Paylaşım bittiğinde veya kullanıcı tarayıcıdan "Paylaşımı Durdur" dediğinde
                    localStream.getVideoTracks()[0].onended = () => {
                        statusDiv.innerText = "Yayın Durduruldu.";
                        videoElement.srcObject = null;
                    };
                } catch (err) {
                    statusDiv.innerText = "İptal edildi veya hata oluştu.";
                }
            });

        } else {
            // --- İZLEYİCİ TARAFI ---
            const peer = new Peer();

            peer.on('open', () => {
                statusDivText = "Yayına bağlanılıyor...";
                // Admin'e bağlan
                const call = peer.call(ADMIN_PEER_ID, new MediaStream());

                call.on('stream', (remoteStream) => {
                    videoElement.srcObject = remoteStream;
                    videoElement.play().catch(() => {});
                });
            });

            peer.on('error', (err) => {
                console.log("Yayın henüz aktif değil.");
            });
        }
    </script>

</body>
</html>
