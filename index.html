<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: absolute;
            top: -60px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 80px);
            border: none;
        }

        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="video-container">

    <div id="clickShield"></div>

    <iframe
        id="playerFrame"
        src="https://dlstreams.st/stream/stream-62.php"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>

<script>
    let clickCount = 0;
    const maxAllowed = 2; // Her iki cihazda da sınır tam 2 reklam
    const shield = document.getElementById("clickShield");

    // Cihaz tespiti
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    // Yeni sekme açma girişimlerini kökten kesen duvar
    window.open = function() {
        return null;
    };

    if (isMobile) {
        // ==========================================
        // 📱 TELEFON (Reklamları tam 2'de tutan özel ayar)
        // ==========================================
        shield.addEventListener("touchstart", function(e) {
            clickCount++;

            if (clickCount <= maxAllowed) {
                shield.style.pointerEvents = 'none';
                setTimeout(function() {
                    shield.style.pointerEvents = 'auto';
                }, 700); // Mobildeki yığılmayı önleyen süre
            } else {
                shield.remove();
            }
        });

    } else {
        // ==========================================
        // 🖥️ BİLGİSAYAR (Hızlı, akıcı ve odak korumalı ana sistem)
        // ==========================================
        shield.addEventListener("mousedown", function(e) {
            clickCount++;

            if (clickCount <= maxAllowed) {
                shield.style.pointerEvents = 'none';
                setTimeout(function() {
                    shield.style.pointerEvents = 'auto';
                }, 300); // Bilgisayar için hızlı tepki süresi
            } else {
                shield.remove();
            }
        });

        // Bilgisayarda odak kayması olursa sayfayı hemen geri çeken kilit
        window.addEventListener('blur', function() {
            if (clickCount > maxAllowed) {
                window.focus();
            }
        });
    }
</script>

</body>
</html>
