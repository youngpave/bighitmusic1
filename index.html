<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Canlı Yayın</title>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #playerContainer {
            position: fixed;
            inset: 0;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }

        #controls {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 10px;
            background: linear-gradient(
                transparent,
                rgba(0,0,0,.85)
            );
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            background: none;
            border: 0;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        #seekBar {
            flex: 1;
        }

        #liveBadge {
            font-size: 12px;
            font-weight: bold;
        }

        input[type="range"] {
            accent-color: red;
        }
    </style>
</head>

<body>

<div id="playerContainer">

    <video
        id="video"
        autoplay
        playsinline
        controlslist="nodownload">
    </video>

    <div id="controls">

        <button id="playBtn">▶</button>

        <input
            id="seekBar"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1">

        <button id="muteBtn">🔊</button>

        <input
            id="volumeBar"
            type="range"
            min="0"
            max="1"
            value="1"
            step="0.01">

        <span id="liveBadge">LIVE -50s</span>

        <button id="liveBtn">LIVE</button>

        <button id="fullscreenBtn">⛶</button>

    </div>
</div>

<script>

var video = document.getElementById("video");

var playBtn = document.getElementById("playBtn");
var muteBtn = document.getElementById("muteBtn");
var volumeBar = document.getElementById("volumeBar");
var seekBar = document.getElementById("seekBar");
var liveBtn = document.getElementById("liveBtn");
var fullscreenBtn = document.getElementById("fullscreenBtn");


// ======================================================
// AYARLAR
// ======================================================

var DELAY_FROM_LIVE = 50;


// ======================================================
// M3U8
// ======================================================

var videoSrc =
'https://vix.ijekhaje.xyz/tflix/secure/06a2a7fc2004144c88af584dcdc1ff7547ce841f5ba9e1453d2eec06d211a69d/1791398417/bein1tr.m3u8';


// ======================================================
// HLS
// ======================================================

var hlsConfig = {

    // HLS.js'in canlı konumu da yaklaşık 50 saniye geride
    liveSyncDuration: 50,

    // Fazla gecikmede toparlanmasına izin verilen sınır
    liveMaxLatencyDuration: 120,

    // Gereksiz aşırı buffer oluşmasını engelle
    maxBufferLength: 60,
    maxMaxBufferLength: 120,

    fragLoadingTimeOut: 20000,
    manifestLoadingTimeOut: 20000
};


var hls;


// ======================================================
// CANLI YAYIN KONUMU
// ======================================================

function getLiveEdge() {

    if (!video.buffered.length) {
        return null;
    }

    var last = video.buffered.length - 1;

    return video.buffered.end(last);
}


function getBufferStart() {

    if (!video.buffered.length) {
        return null;
    }

    var last = video.buffered.length - 1;

    return video.buffered.start(last);
}


// ======================================================
// 50 SANİYE GERİYE GİT
// ======================================================

function go50SecondsBehind() {

    if (!video.buffered.length) {
        return false;
    }

    var last = video.buffered.length - 1;

    var liveEdge = video.buffered.end(last);
    var bufferStart = video.buffered.start(last);

    var target = liveEdge - DELAY_FROM_LIVE;


    // Eğer M3U8 50 saniye tutmuyorsa
    // mevcut en eski noktaya git
    if (target < bufferStart) {
        target = bufferStart;
    }


    video.currentTime = target;

    return true;
}


// ======================================================
// YAYINI SÜREKLİ 50 SANİYE GERİDE TUT
// ======================================================

function keep50SecondsBehindLive() {

    if (!video.buffered.length) {
        return;
    }

    var last = video.buffered.length - 1;

    var liveEdge = video.buffered.end(last);
    var bufferStart = video.buffered.start(last);

    var target = liveEdge - DELAY_FROM_LIVE;


    // 50 saniyelik hedef buffer'ın dışındaysa
    // mevcut başlangıç noktasını kullan
    if (target < bufferStart) {
        target = bufferStart;
    }


    var difference =
        Math.abs(video.currentTime - target);


    /*
        Küçük farkları sürekli seek yaparak düzeltmiyoruz.

        Örneğin:
        hedef = 50 saniye geride
        player = 48.5 saniye geride

        Bu durumda dokunmuyoruz.

        Ancak player ciddi şekilde canlıya yaklaşırsa
        tekrar 50 saniye geriye alıyoruz.
    */

    if (difference > 5) {

        video.currentTime = target;

    }

}


// ======================================================
// SEEK BAR
// ======================================================

function updateSeekBar() {

    if (!video.buffered.length) {
        return;
    }

    var last = video.buffered.length - 1;

    var start = video.buffered.start(last);
    var end = video.buffered.end(last);

    var range = end - start;

    if (range <= 0) {
        return;
    }

    var position =
        ((video.currentTime - start) / range) * 100;


    seekBar.value =
        Math.max(0, Math.min(100, position));
}


// ======================================================
// SEEK BAR'A BASILDIĞINDA
// ======================================================

seekBar.addEventListener("input", function() {

    if (!video.buffered.length) {
        return;
    }

    var last = video.buffered.length - 1;

    var start = video.buffered.start(last);
    var end = video.buffered.end(last);

    var range = end - start;

    var newTime =
        start + (seekBar.value / 100) * range;

    video.currentTime = newTime;

});


// ======================================================
// PLAY / PAUSE
// ======================================================

playBtn.addEventListener("click", function() {

    if (video.paused) {

        video.play();

        playBtn.innerText = "❚❚";

    } else {

        video.pause();

        playBtn.innerText = "▶";

    }

});


// ======================================================
// SES
// ======================================================

volumeBar.addEventListener("input", function() {

    video.volume = volumeBar.value;

    if (video.volume === 0) {

        video.muted = true;
        muteBtn.innerText = "🔇";

    } else {

        video.muted = false;
        muteBtn.innerText = "🔊";

    }

});


muteBtn.addEventListener("click", function() {

    video.muted = !video.muted;

    if (video.muted) {

        muteBtn.innerText = "🔇";

    } else {

        muteBtn.innerText = "🔊";

    }

});


// ======================================================
// LIVE BUTONU
// ======================================================

liveBtn.addEventListener("click", function() {

    go50SecondsBehind();

});


// ======================================================
// FULLSCREEN
// ======================================================

fullscreenBtn.addEventListener("click", function() {

    if (!document.fullscreenElement) {

        if (video.requestFullscreen) {

            video.requestFullscreen();

        } else if (document.documentElement.requestFullscreen) {

            document.documentElement.requestFullscreen();

        }

    } else {

        document.exitFullscreen();

    }

});


// ======================================================
// TIME UPDATE
// ======================================================

video.addEventListener("timeupdate", function() {

    updateSeekBar();

});


// ======================================================
// HLS BAŞLAT
// ======================================================

if (Hls.isSupported()) {

    hls = new Hls(hlsConfig);

    hls.loadSource(videoSrc);

    hls.attachMedia(video);


    // --------------------------------------------------
    // MANIFEST HAZIR
    // --------------------------------------------------

    hls.on(Hls.Events.MANIFEST_PARSED, function() {

        video.play()
            .then(function() {

                playBtn.innerText = "❚❚";

            })
            .catch(function() {

                // Mobil tarayıcı autoplay engellerse
                video.muted = true;

                muteBtn.innerText = "🔇";

                video.play()
                    .then(function() {

                        playBtn.innerText = "❚❚";

                    })
                    .catch(function() {});

            });

    });


    // --------------------------------------------------
    // VIDEO OYNATMAYA HAZIR OLDUĞUNDA
    // 50 SANİYE GERİYE AL
    // --------------------------------------------------

    video.addEventListener("canplay", function() {

        /*
            Birkaç kez denemek önemli.
            MANIFEST_PARSED geldiğinde buffer henüz
            yeterince dolmamış olabilir.
        */

        setTimeout(function() {

            go50SecondsBehind();

        }, 500);

    }, { once: true });


    // --------------------------------------------------
    // HLS HATALARI
    // --------------------------------------------------

    hls.on(Hls.Events.ERROR, function(event, data) {

        if (!data.fatal) {
            return;
        }


        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {

            console.log("Network error - yeniden yükleniyor...");

            hls.startLoad();

        }

        else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {

            console.log("Media error - kurtarılıyor...");

            hls.recoverMediaError();

        }

        else {

            console.log("Fatal HLS error");

            hls.destroy();

        }

    });

}


// ======================================================
// SAFARI / NATIVE HLS
// ======================================================

else if (video.canPlayType("application/vnd.apple.mpegurl")) {

    video.src = videoSrc;

    video.addEventListener("loadedmetadata", function() {

        video.play()
            .catch(function() {

                video.muted = true;

                muteBtn.innerText = "🔇";

                video.play().catch(function(){});

            });

    });

}


// ======================================================
// HER 2 SANİYEDE 50 SANİYELİK GECİKMEYİ KONTROL ET
// ======================================================

setInterval(function() {

    keep50SecondsBehindLive();

}, 2000);


</script>

</body>
</html>
