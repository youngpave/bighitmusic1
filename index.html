<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Kesintisiz Mobil Oynatıcı</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            overflow: hidden;
        }

        .video-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0f19;
        }

        .video-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 
          🛡️ Şeffaf Reklam Engelleyici Kalkan:
          İlk 6 saniye (2 reklam süresi boyunca) kapalıdır, yayın ve player rahatça açılır.
          Süre dolduktan sonra aktifleşerek arkadan reklam/pop-up açılmasını tetikleyecek 
          tüm dış tıklamaları tamamen engeller.
        */
        #adBlockShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            display: none; /* Başlangıçta gizli */
        }
    </style>
</head>
<body>

    <div class="video-wrapper">
        <!-- Reklam Kalkanı -->
        <div id="adBlockShield"></div>

        <!-- Sandbox'sız, tamamen saf ve özgür oynatıcı -->
        <iframe 
            id="streamFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        window.onload = function() {
            // İlk 6 saniye (yaklaşık 2 reklam süresi) boyunca hiçbir şeye dokunulmaz, yayın sorunsuz başlar.
            setTimeout(function() {
                const shield = document.getElementById("adBlockShield");
                if (shield) {
                    shield.style.display = "block"; // Kalkan örtülür
                    console.log("2 reklam süresi doldu: Kalkan aktif, artık reklam çıkmaz!");
                }
            }, 6 * 1000); // 6 Saniye
        };
    </script>

</body>
</html>
