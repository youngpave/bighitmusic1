<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;  
            height: 100%; 
            border: none;
        }
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <div id="clickShield"></div>

        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const shield = document.getElementById("clickShield");

        if (!isMobile) {
            // 🖥️ BİLGİSAYAR: İstediğin gibi zırhlı sandbox sistemi
            const container = document.getElementById("container");
            const oldFrame = document.getElementById("playerFrame");
            if (oldFrame) {
                const currentSrc = oldFrame.src;
                oldFrame.remove();

                const secureFrame = document.createElement("iframe");
                secureFrame.id = "playerFrame";
                secureFrame.src = currentSrc;
                secureFrame.setAttribute(
                    "sandbox",
                    "allow-scripts allow-same-origin allow-presentation allow-forms"
                );
                secureFrame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                secureFrame.setAttribute("allowfullscreen", "true");
                secureFrame.style.position = "absolute";
                secureFrame.style.top = "0";
                secureFrame.style.left = "0";
                secureFrame.style.width = "100%";
                secureFrame.style.height = "100%";
                secureFrame.style.border = "none";

                container.appendChild(secureFrame);
            }
            shield.remove();
        } 
        else {
            // 📱 TELEFON: Asla Unutmayan URL Hash + LocalStorage Çift Kilit Sistemi
            const KEY = "mactv_counter";
            const MAX = 2;

            // Sayacı hem localStorage'dan, hem window.name'den, hem de URL Hash'ten (<-- Asla silinemez) okumaya çalış
            function getCount() {
                try {
                    if (window.location.hash.includes("mactv_done=true")) return MAX;
                    const localVal = localStorage.getItem(KEY);
                    const nameVal = window.name;
                    if (localVal >= MAX || nameVal >= MAX) return MAX;
                    return parseInt(localVal || nameVal || "0", 10);
                } catch (e) {
                    return 0;
                }
            }

            let count = getCount();

            if (count >= MAX) {
                shield.remove();
            } else {
                shield.addEventListener("touchstart", function () {
                    count++;
                    
                    try {
                        localStorage.setItem(KEY, count);
                        window.name = count.toString();
                        if (count >= MAX) {
                            // Sınır dolduğu an URL'ye mactv_done=true mühürünü vuruyoruz. 
                            // Tarayıcı tüm önbelleğini silse bile adres çubuğundaki bu mühür kalır ve sayacı unutmaz!
                            history.replaceState(null, "", "#mactv_done=true");
                        }
                    } catch (e) {}

                    if (count >= MAX) {
                        shield.remove();
                        return;
                    }

                    shield.style.pointerEvents = "none";
                    setTimeout(function () {
                        if (shield && shield.parentNode) {
                            shield.style.pointerEvents = "auto";
                        }
                    }, 1200);

                }, { passive: true });
            }

            // Sekme arkaya kaçarsa odakla geri çek
            window.open = function() { return null; };
            window.addEventListener('blur', function() {
                if (getCount() >= MAX) {
                    window.focus();
                }
            });
        }
    </script>

</body>
</html>
