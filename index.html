<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: absolute;
            top: -60px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 80px);
            border: none;
        }

        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="video-container" id="container">

    <div id="clickShield"></div>

    <iframe
        id="playerFrame"
        src="https://dlstreams.st/stream/stream-62.php"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>

<script>
    let clickCount = 0;
    const shield = document.getElementById("clickShield");
    const container = document.getElementById("container");

    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    window.open = function() {
        return null;
    };

    // 🖥️ BİLGİSAYAR İÇİN: Sayfa açıldığı an (veya ilk tıklamada) iframe'i tamamen sandbox'a alıp reklamları sıfırlıyoruz
    if (!isMobile) {
        const oldFrame = document.getElementById("playerFrame");
        if (oldFrame) {
            const currentSrc = oldFrame.src;
            oldFrame.remove();

            // Bilgisayar için reklamları tamamen bitiren kilitli sandbox iframe
            const secureFrame = document.createElement("iframe");
            secureFrame.id = "playerFrame";
            secureFrame.src = currentSrc;
            // Sadece videonun çalışmasına izin verip reklam script'lerini tamamen patlatan sandbox
            secureFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation");
            secureFrame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
            secureFrame.setAttribute("allowfullscreen", "true");
            
            secureFrame.style.position = "absolute";
            secureFrame.style.top = "-60px";
            secureFrame.style.left = "-10px";
            secureFrame.style.width = "calc(100% + 20px)";
            secureFrame.style.height = "calc(100% + 80px)";
            secureFrame.style.border = "none";

            container.appendChild(secureFrame);
        }
        // Bilgisayarda kalkanı tamamen uçuruyoruz çünkü zaten sandbox reklamları engelliyor
        shield.remove();
    } else {
        // 📱 TELEFON İÇİN: Eskisi gibi 2 reklam izni veren kalkan sistemi
        const maxAllowed = 1;
        function handleMobileInteraction(e) {
            clickCount++;
            if (clickCount <= maxAllowed) {
                shield.style.pointerEvents = 'none';
                setTimeout(function() {
                    shield.style.pointerEvents = 'auto';
                }, 1000);
            } else {
                shield.remove();
            }
        }
        shield.addEventListener("touchstart", handleMobileInteraction);
    }
</script>

</body>
</html>
