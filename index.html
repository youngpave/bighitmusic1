<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        /*
         * Üst reklamı mümkün olduğunca yukarıda bırakıyoruz.
         * Alttaki reklamın görünmesini azaltmak için iframe alanını
         * ekranın tamamından biraz daha kısa tutuyoruz.
         */
        .player-window {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            bottom: 0;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: absolute;

            /* Üstteki reklamı yukarı taşır */
            top: -250px;

            left: -10px;
            width: calc(100% + 20px);

            /*
             * İçeriğin alt kısmının container dışına taşmasını sağlar
             */
            height: calc(100% + 250px);

            border: none;
        }

        /*
         * İlk tıklamayı bilerek iframe'e geçirmiyoruz.
         * Böylece ilk tıklamadaki reklam yönlendirmesi azalıyor.
         */
        #clickShield {
            position: absolute;
            inset: 0;
            z-index: 9999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="video-container">

    <div class="player-window">

        <iframe
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php"
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>

    <!-- İlk tıklamayı yutan kalkan -->
    <div id="clickShield" onclick="handleScreenClick()"></div>

</div>

<script>

let clickCount = 0;

function handleScreenClick() {

    clickCount++;

    const shield = document.getElementById("clickShield");

    /*
     * İlk tıklama:
     * Reklam yönlendirmesine gitmesin.
     */
    if (clickCount === 1) {

        shield.style.pointerEvents = "none";

        setTimeout(function () {
            shield.style.display = "none";
        }, 300);
    }
}


/*
 * Sayfa odağını koruyor.
 * Mevcut davranışını değiştirmedim.
 */
window.addEventListener("blur", function () {

    setTimeout(function () {
        window.focus();
    }, 50);

});

</script>

</body>
</html>
