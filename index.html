<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - 3 Reklam Sonrası Sert Sandbox</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-box {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-box" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı -->
            <iframe 
                id="streamFrame"
                src="https://dlstreams.st/watch/stream-62.php" 
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById("playerContainer");
            const url = "https://dlstreams.st/watch/stream-63.php";

            // Player'ı oluşturan ana yapı
            function buildPlayer(isStrictMode) {
                let frame = document.getElementById("streamFrame");
                if (frame) {
                    frame.remove();
                }

                const newFrame = document.createElement("iframe");
                newFrame.id = "streamFrame";
                newFrame.src = url;

                if (isStrictMode) {
                    // 🛡️ 3 REKLAMDAN SONRA: En sert sandbox (Reklamları tamamen sıfıra indirir, yeni sekme/pop-up açtırmaz)
                    newFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms");
                } else {
                    // 🔓 İLK AÇILIŞ (İlk 3 reklam): Player'ın kilitlenmemesi için geçici esnek mod
                    newFrame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-popups allow-presentation allow-forms");
                }

                newFrame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                newFrame.setAttribute("allowfullscreen", "true");
                
                container.appendChild(newFrame);
            }

            // 1. Adım: İlk açılışta ilk 3 reklamın sorunsuz dökülmesi için esnek modla başla
            buildPlayer(false);

            // 2. Adım: İlk 3 reklamın oynaması için gereken süre (yaklaşık 18 saniye) bittiği an 
            // sert sandbox devreye girer ve reklamları tamamen sıfırlar!
            setTimeout(function() {
                console.log("İlk 3 reklam atlatıldı, Sert Sandbox devreye giriyor, reklamlar sıfırlanıyor...");
                buildPlayer(true);
            }, 18 * 1000); // 18 saniye sonra sert kilit aktifleşir

            // 3. Adım: Uzun süreli yayınlarda olası şişmelere karşı her 15 dakikada bir 
            // yine sert sandbox moduyla sıfırdan taze başlangıç
            setInterval(function() {
                buildPlayer(true);
            }, 15 * 60 * 1000);

        })();
    </script>
</body>
</html>
