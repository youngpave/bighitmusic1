<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: absolute;
            top: -60px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 80px);
            border: none;
        }

        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="video-container">

    <div id="clickShield"></div>

    <!-- Başlangıçta sandbox yok, player rahatça çalışıp yayını başlatır -->
    <iframe
        id="playerFrame"
        src="https://dlstreams.st/stream/stream-62.php"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>

<script>
    let clickCount = 0;
    const maxAllowed = 2; // Tam 2 reklam izni
    const shield = document.getElementById("clickShield");
    const iframe = document.getElementById("playerFrame");

    function handleInteraction(e) {
        clickCount++;

        if (clickCount <= maxAllowed) {
            // İlk 2 tıklamada kalkanı anlık açıp kapanmasına izin veriyoruz
            shield.style.pointerEvents = 'none';
            setTimeout(function() {
                shield.style.pointerEvents = 'auto';
            }, 300);
        }

        // Sınır dolduğu an (2. tıklamada) KAPIYA SANDBOX'I İNDİRİYORUZ!
        if (clickCount >= maxAllowed) {
            // 1. Kalkanı tamamen ortadan kaldır
            shield.remove();

            // 2. Iframe'e kısıtlayıcı sandbox'ı bas (Yeni sekme açmayı, pop-up'ı tamamen yasaklar)
            iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation allow-forms');
        }
    }

    // Bilgisayar ve telefon için tıklama/dokunma dinleyicileri
    shield.addEventListener("mousedown", handleInteraction);
    shield.addEventListener("touchstart", handleInteraction);
</script>

</body>
</html>
