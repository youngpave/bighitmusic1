<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        iframe {
            position: absolute;
            top: -60px;
            left: -10px;
            width: calc(100% + 20px);
            height: calc(100% + 80px);
            border: none;
        }

        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: transparent;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="video-container" id="container">

    <div id="clickShield"></div>

    <iframe
        id="playerFrame"
        src="https://dlstreams.st/stream/stream-62.php"
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen>
    </iframe>

</div>

<script>
    const shield = document.getElementById("clickShield");

    // Yeni sekme açma girişimlerini kökten kesen duvar
    window.open = function() {
        return null;
    };

    // Aradan günler geçse bile unutulmayan kalıcı hafıza tabanlı sayaç
    let clickCount = parseInt(localStorage.getItem('mactv_exact_two_ads') || '0');
    const maxAllowed = 2;

    if (clickCount >= maxAllowed) {
        shield.remove();
    } else {
        function handleAdsControl(e) {
            clickCount++;
            localStorage.setItem('mactv_exact_two_ads', clickCount);

            if (clickCount < maxAllowed) {
                shield.style.pointerEvents = 'none';
                setTimeout(function() {
                    shield.style.pointerEvents = 'auto';
                }, 1000);
            } else {
                shield.remove();
            }
        }

        shield.addEventListener("click", handleAdsControl);
        shield.addEventListener("touchstart", handleAdsControl);
    }

    // Odak koruması
    window.addEventListener('blur', function() {
        if (clickCount >= maxAllowed) {
            window.focus();
        }
    });

    // 🛡️ İFRAME İÇİNDEKİ O AÇILAN REKLAM TUZAKLARINI ENGELLEME
    // Oynatıcı yüklendikten sonra içindeki dış bağlantı tıklamalarını (target="_blank") yakalayıp engeller
    const iframe = document.getElementById('playerFrame');
    iframe.addEventListener('load', function() {
        try {
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            // İçerideki tüm tıklamaları ve yeni sekme açma girişimlerini izle
            iframeDoc.addEventListener('click', function(e) {
                const target = e.target.closest('a');
                if (target && target.target === '_blank') {
                    e.preventDefault(); // Yeni sekme açılmasını engelle
                    e.stopPropagation();
                }
            }, true);
        } catch (err) {
            // Çapraz site güvenlik politikaları (CORS) nedeniyle bazı dış kaynaklar engellenebilir, 
            // bu durumda tarayıcı tabanlı window.open engellememiz zaten devrede kalır.
        }
    });
</script>

</body>
</html>
