<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Evrensel Oynatıcı</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .app-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .player-box {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="player-box" id="playerContainer">
            <!-- Canlı Yayın Oynatıcısı -->
            <iframe 
                id="streamFrame"
                src="https://dlstreams.st/watch/stream-62.php" 
                allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
                allowfullscreen="true">
            </iframe>
        </div>
    </div>

    <script>
        (function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const container = document.getElementById("playerContainer");
            let frame = document.getElementById("streamFrame");

            if (!isMobile) {
                // 🖥️ BİLGİSAYAR: Sandbox zırhı (Player'ı boğmayan kaçış izinli mod)
                if (frame) {
                    const src = frame.src;
                    frame.remove();

                    const secureFrameElem = document.createElement("iframe");
                    secureFrameElem.id = "streamFrame";
                    secureFrameElem.src = src;
                    secureFrameElem.setAttribute("sandbox", "allow-scripts allow-same-origin allow-presentation allow-forms allow-popups-to-escape-sandbox");
                    secureFrameElem.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                    secureFrameElem.setAttribute("allowfullscreen", "true");
                    
                    container.appendChild(secureFrameElem);
                }
            } else {
                // 📱 TELEFON: Mobil tarayıcı motoruna uygun, tıkınmayan ve akıcı koruma
                // Mobilde iframe'i bozmadan, arka planda akışın rahat çalışmasını sağlayan esnek yapı
                if (frame) {
                    // Telefonda doğrudan native iframe akışı korunur, böylece player asla donmaz
                    console.log("MaçTV Mobil Modu Aktif: Akış esnek çalışıyor.");
                }
            }
        })();
    </script>
</body>
</html>
