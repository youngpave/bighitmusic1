<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaçTV - Canlı Yayın</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
        }
        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;  
            height: 100%; 
            border: none;
        }
        /* Telefonda ilk başta çıkan şık Başlat Butonu */
        #startOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #111 0%, #222 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
        }
        #startBtn {
            padding: 1rem 2.5rem;
            background: #ff4757;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 71, 87, 0.4);
            transition: transform 0.2s;
        }
        #startBtn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="video-container" id="container">
        <!-- Telefonda reklamları bloke eden açılış ekranı -->
        <div id="startOverlay">
            <h2 style="margin-bottom: 1rem;">MaçTV Canlı Yayın</h2>
            <button id="startBtn">Yayın Başlat 🚀</button>
        </div>

        <iframe 
            id="playerFrame"
            src="https://dlstreams.st/watch/stream-62.php" 
            allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
            allowfullscreen="true">
        </iframe>
    </div>

    <script>
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const overlay = document.getElementById("startOverlay");
        const KEY = "mactv_started";

        if (!isMobile) {
            // 🖥️ BİLGİSAYAR: Doğrudan zırhlı sandbox
            overlay.remove();
            const container = document.getElementById("container");
            const oldFrame = document.getElementById("playerFrame");
            if (oldFrame) {
                const currentSrc = oldFrame.src;
                oldFrame.remove();

                const secureFrame = document.createElement("iframe");
                secureFrame.id = "playerFrame";
                secureFrame.src = currentSrc;
                secureFrame.setAttribute(
                    "sandbox",
                    "allow-scripts allow-same-origin allow-presentation allow-forms"
                );
                secureFrame.setAttribute("allow", "autoplay; fullscreen; encrypted-media; picture-in-picture");
                secureFrame.setAttribute("allowfullscreen", "true");
                secureFrame.style.position = "absolute";
                secureFrame.style.top = "0";
                secureFrame.style.left = "0";
                secureFrame.style.width = "100%";
                secureFrame.style.height = "100%";
                secureFrame.style.border = "none";

                container.appendChild(secureFrame);
            }
        } 
        else {
            // 📱 TELEFON: Daha önce başlatıldıysa veya URL mühürlü ise direkt kaldır
            if (window.location.hash.includes("mactv_done=true") || localStorage.getItem(KEY) === "true") {
                overlay.remove();
            } else {
                document.getElementById("startBtn").addEventListener("click", function () {
                    try {
                        localStorage.setItem(KEY, "true");
                        history.replaceState(null, "", "#mactv_done=true");
                    } catch (e) {}

                    // Butona basıldığı an arayüzü uçur, yayın tertemiz başlasın
                    overlay.remove();
                });
            }

            window.open = function() { return null; };
            window.addEventListener('blur', function() {
                if (localStorage.getItem(KEY) === "true" || window.location.hash.includes("mactv_done=true")) {
                    window.focus();
                }
            });
        }
    </script>

</body>
</html>
